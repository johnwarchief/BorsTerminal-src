<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>CandleEdge — نمای پژوهشی بازار واقعی</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111b2e;
      --panel-2: #16243c;
      --line: #243551;
      --text: #e6edf7;
      --muted: #93a4bf;
      --up: #10b981;
      --down: #f43f5e;
      --neutral: #f59e0b;
      --accent: #60a5fa;
      --chip: #1d2d49;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.7 "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      background: linear-gradient(180deg, #0e1728, #0b1220);
    }
    h1 { font-size: 16px; margin: 0; font-weight: 700; }
    .sub { color: var(--muted); font-size: 12px; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 14px;
      padding: 14px;
      height: calc(100vh - 64px);
      min-height: 640px;
    }
    .left { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; min-height: 0; }
    .right { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; min-height: 0; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      min-height: 0;
    }
    .controls {
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    label { color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
    select, button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 9px;
      font: inherit;
      min-width: 110px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .series-key {
      margin-inline-start: auto;
      color: var(--muted);
      font-size: 12px;
      background: var(--chip);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      white-space: nowrap;
    }
    .chart-wrap { position: relative; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    .legend {
      position: absolute;
      inset-inline-start: 12px;
      top: 10px;
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
      flex-wrap: wrap;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 4px; vertical-align: middle; }
    .tabs { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
    .tabs button.active { border-color: var(--accent); color: #fff; background: #1b3153; }
    .panel-body { padding: 10px 12px; overflow: auto; height: calc(100% - 46px); }
    .event {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 7px;
      cursor: pointer;
      background: #0f1a2c;
    }
    .event:hover { border-color: var(--accent); }
    .event.selected { border-color: var(--accent); background: #13233c; }
    .event.muted { opacity: 0.35; }
    .event-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .detector { font-weight: 700; }
    .badge {
      border-radius: 999px;
      padding: 1px 8px;
      font-size: 11px;
      background: var(--chip);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .badge.bull { color: #6ee7b7; border-color: #1e5b47; }
    .badge.bear { color: #fda4af; border-color: #6b2434; }
    .badge.neutral { color: #fcd34d; border-color: #6b5520; }
    .badge.mixed { color: #c4b5fd; border-color: #4c3d86; }
    .event-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .anchors { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .anchor {
      font-size: 11px;
      color: #cbd5e1;
      background: #15243a;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 6px;
    }
    .group {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 7px;
      cursor: pointer;
      background: #0f1a2c;
    }
    .group:hover { border-color: var(--accent); }
    .group.selected { border-color: var(--accent); background: #13233c; }
    .group-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .rank { color: var(--accent); font-weight: 700; min-width: 22px; }
    .rule { color: var(--muted); font-size: 11px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .empty { color: var(--muted); padding: 12px; }
    .footer {
      padding: 8px 12px;
      color: var(--muted);
      font-size: 11px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .warn { color: #fbbf24; }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; height: auto; }
      .left { min-height: 520px; }
      .right { min-height: 520px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>CandleEdge — نمای پژوهشی بازار واقعی</h1>
      <div class="sub">کندلِ تعدیل‌شدهٔ سرور، رویدادهای تأییدشده، و شواهدِ لنگر. سیگنالِ رسمی یا توصیهٔ معاملاتی نیست.</div>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="card controls">
        <label>نماد<select id="symbol"></select></label>
        <label>تایم‌فریم<select id="timeframe">
          <option value="D">روزانه</option>
          <option value="W">هفتگی</option>
          <option value="M">ماهانه</option>
        </select></label>
        <label>سری<select id="mode">
          <option value="adjusted">تعدیل‌شده</option>
          <option value="raw">خام</option>
        </select></label>
        <label>آشکارساز<select id="detector"><option value="">همه</option></select></label>
        <span class="series-key" id="seriesKey">—</span>
      </div>

      <div class="card chart-wrap">
        <canvas id="chart"></canvas>
        <div class="legend">
          <span><i class="dot" style="background:var(--up)"></i>صعودی</span>
          <span><i class="dot" style="background:var(--down)"></i>نزولی</span>
          <span><i class="dot" style="background:var(--neutral)"></i>خنثی / موقت</span>
        </div>
      </div>

      <div class="card">
        <div class="tabs">
          <button id="tabEvents" class="active">رویدادها</button>
          <button id="tabGroups">گروه‌های سالینس</button>
          <span class="sub" id="selectionNote" style="margin-inline-start:auto"></span>
        </div>
        <div class="panel-body" id="eventPanel" style="max-height:270px"></div>
        <div class="panel-body" id="groupPanel" style="max-height:270px;display:none"></div>
        <div class="footer" id="footer"></div>
      </div>
    </section>

    <aside class="right">
      <div class="card">
        <div class="tabs"><button class="active" id="tabDetail">شواهد رویداد</button></div>
        <div class="panel-body" id="detail" style="max-height:36vh"></div>
      </div>
      <div class="card">
        <div class="tabs">
          <button class="active">سالینس</button>
          <select id="method" style="margin-inline-start:auto">
            <option value="latest">آخرین تأیید</option>
            <option value="structure_first">ساختار اول</option>
            <option value="evidence_count">غنای شواهد</option>
          </select>
        </div>
        <div class="rule" id="rule"></div>
        <div class="panel-body" id="saliencePanel"></div>
      </div>
    </aside>
  </main>

  <script src="./viewer.js"></script>
</body>
</html>
