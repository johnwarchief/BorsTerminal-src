[package]
name = "bors-m2-shell"
version = "0.2.0"
description = "BorsTerminal Phase E Tauri v2 shell prototype"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
