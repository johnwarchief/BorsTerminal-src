[package]
name = "bors-m1-shell"
version = "0.1.0"
description = "BorsTerminal M1 desktop-shell prototype (Tauri v2)"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
