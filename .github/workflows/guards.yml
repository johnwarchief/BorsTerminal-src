name: guards

# BorsTerminal CI Pipeline:
# - python-guards: 110 offline guard suites (reproducible fixtures)
# - go-backend: Go 1.27.3, go vet, AST architectural guard (0 sql.Open outside internal/db), unit/integration suites
# - frontend-v2: Node 22, tsc typecheck, 368 vitest unit tests, production build
# - js-syntax: Legacy static asset syntax verification
# - repo-hygiene: .gitattributes, no tracked-but-ignored files, zero untracked garbage

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  python-guards:
    name: offline guard suites (python dev/run_all_tests.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all offline guard suites
        # Run the suites through tee so, on failure, the tail can be surfaced as
        # check-run annotations (readable via the check-runs API even when the
        # raw job-log blob host is unreachable from a given network).
        run: |
          set +e
          python dev/run_all_tests.py 2>&1 | tee "$RUNNER_TEMP/guards.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "===== tail of guard output ====="
            tail -n 60 "$RUNNER_TEMP/guards.log"
            tail -n 10 "$RUNNER_TEMP/guards.log" | while IFS= read -r l; do
              echo "::error title=guards::$l"
            done
          fi
          exit "$rc"

  go-backend:
    name: go backend (vet / ast-arch / unit-tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true
          cache-dependency-path: backend-go/go.sum

      - name: Go Version
        run: go version

      - name: Go Vet
        run: go vet ./...

      - name: AST Architecture Guard (No direct sql.Open outside internal/db)
        run: go test -v ./internal/db -run TestArchitectureNoDirectSQLOpen

      - name: Run All Go Unit Tests
        run: go test -v ./...

  go-race:
    name: go race detector (cmd/borsd + generation runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true
          cache-dependency-path: backend-go/go.sum

      - name: GCC (race detector requires cgo)
        run: gcc --version

      - name: Race Detector (borsd)
        run: go test -race -count=1 ./cmd/borsd

      - name: Race Detector (generation runtime)
        run: go test -race -count=1 ./internal/generation/... ./internal/snapshot/... ./internal/pointerfile/...

  go-windows:
    name: go backend on windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true
          cache-dependency-path: backend-go/go.sum

      - name: Go Vet
        run: go vet ./...

      - name: Windows binary
        shell: bash
        run: |
          set -e
          mkdir -p ../dist-ci
          go build -o ../dist-ci/BorsTerminal_Ultimate.exe ./cmd/borsd
          ls -l ../dist-ci/BorsTerminal_Ultimate.exe

      - name: Unit tests (native windows)
        run: go test ./...

  delivery-contract:
    name: bundle contract / data packs / artifact hashes
    runs-on: windows-latest
    needs: [go-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true
          cache-dependency-path: backend-go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Build frontend-v2
        working-directory: frontend-v2
        run: |
          npm ci
          npm run build

      - name: Assemble bundle
        shell: bash
        run: |
          set -e
          mkdir -p dist-ci/frontend dist-ci/data/ra365_calendar
          cp -r frontend-v2/dist/. dist-ci/frontend/
          test -f dist-ci/frontend/index.html
          cp -r data/ra365_calendar/ra365-r32d dist-ci/data/ra365_calendar/ra365-r32d
          test -n "$(ls -A dist-ci/data/ra365_calendar/ra365-r32d)"
          if [ -d data/ra365_corrections ]; then
            cp -r data/ra365_corrections dist-ci/data/ra365_corrections
            test -n "$(ls -A dist-ci/data/ra365_corrections)"
          fi
          ( cd backend-go && go build -o ../dist-ci/BorsTerminal_Ultimate.exe ./cmd/borsd )

      - name: Bundle contract (zero python/uvicorn/fastapi)
        shell: bash
        run: |
          set -e
          ( cd backend-go && go run ./cmd/bundlecheck -path ../dist-ci -json )

      - name: Artifact hashes
        shell: bash
        run: |
          set -e
          sha256sum dist-ci/BorsTerminal_Ultimate.exe > delivery-artifacts.sha256
          find dist-ci/frontend dist-ci/data -type f -print0 | sort -z | xargs -0 sha256sum >> delivery-artifacts.sha256
          echo "--- artifact manifest ---"
          cat delivery-artifacts.sha256

      - name: Upload artifact manifest
        uses: actions/upload-artifact@v4
        with:
          name: delivery-artifacts
          path: delivery-artifacts.sha256
          if-no-files-found: error

  data-integrity:
    name: data integrity guards (ingestion / candles / backfill)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provenance + thin-snapshot guards
        run: python dev/test_phase47_ingestion_v1.py

      - name: Candle contract
        run: python dev/candle_contract_v1071.py

      - name: History repair + gap fill on temp DB
        run: |
          python dev/test_round18_history_repair_v1.py
          python dev/test_history_gap_repair_v1.py

  frontend-v2:
    name: frontend v2 (typecheck / vitest / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Vitest Unit Tests
        run: npx vitest run

      - name: Build Production Bundle
        run: npm run build

  js-syntax:
    name: node --check on our bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check first-party JS
        run: |
          set -e
          for f in \
            static/app.js \
            static/fundamental_ui.js \
            static/portfolio_ui.js \
            static/tech_rtv.js \
            static/tech_tools.js \
            static/tech_365.js \
            static/mstat.js \
            static/selection.js \
            static/calendar/calendar.js \
            static/calendar/calendarService.js \
            static/vendor/drawing_math.js
          do
            if [ -f "$f" ]; then
              echo "node --check $f"
              node --check "$f"
            else
              echo "skip (not in repo): $f"
            fi
          done

  repo-hygiene:
    name: EOL / attributes / no tracked junk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .gitattributes must exist and pin LF + CRLF launchers
        run: |
          set -e
          test -f .gitattributes
          git check-attr eol -- app.py | grep -q 'eol: lf'
          git check-attr eol -- run_terminal.bat | grep -q 'eol: crlf'

      - name: No tracked file may be gitignored
        run: |
          set -e
          out=$(git ls-files -i -c --exclude-standard)
          if [ -n "$out" ]; then echo "ignored but tracked:"; echo "$out"; exit 1; fi

      - name: Nothing untracked may have crept in
        run: |
          set -e
          out=$(git ls-files --others --exclude-standard)
          if [ -n "$out" ]; then echo "untracked files:"; echo "$out"; exit 1; fi
