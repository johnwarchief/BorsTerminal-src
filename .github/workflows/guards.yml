name: guards

# This repo's correctness lives in dev/*.py guard scripts, not in unit tests.
# CI runs exactly what a developer runs locally, so a green PR locally is green here.
#
#   python dev/run_all_tests.py     -> 12 offline guard suites
#   node --check static/*.js        -> JS syntax (no bundler in this project)
#
# The server smoke test (dev/serve_check_v95.py) needs a live uvicorn on :8012
# and a market.db, so it is intentionally NOT part of CI.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  python-guards:
    name: offline guard suites (python dev/run_all_tests.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all offline guard suites
        # Run the suites through tee so, on failure, the tail can be surfaced as
        # check-run annotations (readable via the check-runs API even when the
        # raw job-log blob host is unreachable from a given network).
        run: |
          set +e
          python dev/run_all_tests.py 2>&1 | tee "$RUNNER_TEMP/guards.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "===== tail of guard output ====="
            tail -n 60 "$RUNNER_TEMP/guards.log"
            tail -n 10 "$RUNNER_TEMP/guards.log" | while IFS= read -r l; do
              echo "::error title=guards::$l"
            done
          fi
          exit "$rc"

  frontend:
    name: frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    # این جاب جایگزینِ `js-syntax` شد. آن جاب روی ۱۱ فایلِ static/*.js
    # `node --check` می‌زد که ۹ تایشان در فاز ۷ به archive/legacy_static رفتند؛
    # پس «skip (not in repo)» چاپ می‌کرد و سبز می‌شد بی‌آنکه چیزی را نگه دارد.
    # در همان حال ۳۵۶ فایلِ TS و ۱۲۴۷ تستِ vitest فقط سرِ تگ (release.yml)
    # دیده می‌شدند، یعنی یک PR می‌توانست سبز باشد و UI را شکسته باشد.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      # همان چیزی که از جابِ قبلی زنده مانده بود: دو باندلِ فرست‌پارتیِ
      # بی‌بandler که هنوز در static/ هستند و هیچ tsc/eslintی نمی‌بیندشان.
      - name: Syntax-check the remaining bundler-less JS
        run: |
          set -e
          for f in static/calendar/calendar.js static/calendar/calendarService.js; do
            echo "node --check $f"
            node --check "$f"
          done

  repo-hygiene:
    name: EOL / attributes / no tracked junk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .gitattributes must exist and pin LF + CRLF launchers
        run: |
          set -e
          test -f .gitattributes
          git check-attr eol -- app.py | grep -q 'eol: lf'
          git check-attr eol -- run_terminal.bat | grep -q 'eol: crlf'

      - name: No tracked file may be gitignored
        run: |
          set -e
          out=$(git ls-files -i -c --exclude-standard)
          if [ -n "$out" ]; then echo "ignored but tracked:"; echo "$out"; exit 1; fi

      - name: Nothing untracked may have crept in
        run: |
          set -e
          out=$(git ls-files --others --exclude-standard)
          if [ -n "$out" ]; then echo "untracked files:"; echo "$out"; exit 1; fi
