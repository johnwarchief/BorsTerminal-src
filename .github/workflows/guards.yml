name: guards

# BorsTerminal production gate (Phase 4.9.1, Task A5):
# - go-backend: Go 1.27.3, go vet, AST architectural guard (0 sql.Open outside internal/db), unit/integration suites
# - frontend-v2: Node 22, tsc typecheck, 368 vitest unit tests, production build
# - data-integrity: the Category-A Python lane (`--profile production`, registry-selected)
# - zero-python-runtime: borsd process tree proves no Python process at runtime
# - repo-hygiene: .gitattributes, no tracked-but-ignored files, zero untracked garbage
#
# The offline Python guard pile left this gate: the data/research suites moved to
# a blocking lane of their own and the legacy suites to a report-only lane.  The
# lane of every suite comes from dev/suite_registry.json.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  go-backend:
    name: go backend (vet / ast-arch / unit-tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true
          cache-dependency-path: backend-go/go.sum

      - name: Go Version
        run: go version

      - name: Go Vet
        run: go vet ./...

      - name: AST Architecture Guard (No direct sql.Open outside internal/db)
        run: go test -v ./internal/db -run TestArchitectureNoDirectSQLOpen

      - name: Run All Go Unit Tests
        run: go test -v ./...

  go-race:
    name: go race detector (cmd/borsd + generation runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true
          cache-dependency-path: backend-go/go.sum

      - name: GCC (race detector requires cgo)
        run: gcc --version

      - name: Race Detector (borsd)
        run: go test -race -count=1 ./cmd/borsd ./internal/update

      - name: Race Detector (generation runtime)
        run: go test -race -count=1 ./internal/generation/... ./internal/snapshot/... ./internal/pointerfile/...

  go-windows:
    name: go backend on windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true
          cache-dependency-path: backend-go/go.sum

      - name: Go Vet
        run: go vet ./...

      - name: Windows binary
        shell: bash
        run: |
          set -e
          mkdir -p ../dist-ci
          go build -o ../dist-ci/BorsTerminal_Ultimate.exe ./cmd/borsd
          ls -l ../dist-ci/BorsTerminal_Ultimate.exe

      - name: Unit tests (native windows)
        run: go test ./...

  delivery-contract:
    name: desktop delivery (Windows bundle + Tauri shell + installer)
    runs-on: windows-latest
    needs: [go-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true
          cache-dependency-path: backend-go/go.sum

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Build frontend-v2
        working-directory: frontend-v2
        run: |
          npm ci
          npm run build

      - name: Assemble production-shaped bundle (Go + Tauri + data)
        shell: bash
        run: |
          set -e
          B=dist-ci/BorsTerminal_Ultimate
          mkdir -p "$B/frontend" "$B/data/ra365_calendar"
          cp -r frontend-v2/dist/. "$B/frontend/"
          test -f "$B/frontend/index.html"
          cp -r data/ra365_calendar/ra365-r32d "$B/data/ra365_calendar/ra365-r32d"
          test -n "$(ls -A "$B/data/ra365_calendar/ra365-r32d")"
          if [ -d data/ra365_corrections ]; then
            cp -r data/ra365_corrections "$B/data/ra365_corrections"
            test -n "$(ls -A "$B/data/ra365_corrections")"
          fi
          test -f market.db
          cp market.db "$B/market.db"
          # دادهٔ کامل: seed از مخزن نیست (*.lzma ایگنور است)، پس از ریلیزِ
          # دادهٔ موجود دانلود می‌شود. market.db.gz مشتقِ سریعِ همان seed است
          # که borsd در اولین اجرا در قالبِ market.db ادغام می‌کند.
          if [ ! -f market.db.lzma ]; then
            echo "::notice::[seed] downloading canonical data baseline from data-latest"
            curl -fsSL --retry 2 --output market.db.lzma \
              "https://github.com/johnwarchief/BorsTerminal/releases/download/data-latest/market.db.lzma"
          fi
          test -f market.db.lzma
          python scripts/make_fast_seed.py market.db.lzma "$B/market.db.gz"
          python scripts/make_fast_seed.py --verify "$B/market.db.gz"
          cp scripts/apply_update.bat "$B/apply_update.bat"
          APP_VERSION=$(python - <<'PY'
          import re
          s = open('bors_config.py', encoding='utf-8').read()
          print(re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)", s).group(1))
          PY
          )
          echo "APP_VERSION=$APP_VERSION"
          ( cd backend-go && go build -ldflags "-X borsterminal/backend/internal/httpapi.version=$APP_VERSION" -o ../dist-ci/BorsTerminal_Ultimate/BorsTerminal_Ultimate.exe ./cmd/borsd )
          printf 'app_version=%s\nsource=ci-guards\n' "$APP_VERSION" > "$B/Version.txt"
          python scripts/build_shell.py --dist "$B"
          test -f "$B/BorsTerminal_Shell.exe"
          ls -l "$B"

      - name: Bundle contract (Go + Tauri + SPA, zero python)
        shell: bash
        run: |
          set -e
          python dev/onedir_contract_v11.py --dist dist-ci
          ( cd backend-go && go run ./cmd/bundlecheck -path ../dist-ci/BorsTerminal_Ultimate -json )

      - name: Seed merge test (real 445k-row seed)
        shell: bash
        working-directory: backend-go
        env:
          BORS_REAL_SEED: ${{ github.workspace }}/dist-ci/BorsTerminal_Ultimate/market.db.gz
          BORS_REAL_TEMPLATE: ${{ github.workspace }}/dist-ci/BorsTerminal_Ultimate/market.db
        run: go test ./internal/seed -run TestRealSeedMerge -count=1 -v

      - name: Artifact hashes
        shell: bash
        run: |
          set -e
          find dist-ci/BorsTerminal_Ultimate -type f -print0 | sort -z | xargs -0 sha256sum > delivery-artifacts.sha256
          echo "--- artifact manifest ---"
          cat delivery-artifacts.sha256

      - name: Build Windows installer artifact
        shell: bash
        run: |
          set -e
          # CI-only password; the release workflow supplies the real one.
          printf '#define SetupPassword "ci-test-only"\n' > installer/.setup_password.iss
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup --no-progress -y; fi
          python - <<'PY' > appver.txt
          import re
          s = open('bors_config.py', encoding='utf-8').read()
          print(re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)", s).group(1))
          PY
          APP_VERSION=$(cat appver.txt)
          echo "APP_VERSION=$APP_VERSION"
          MSYS_NO_PATHCONV=1 "$ISCC" "/DAppVersion=$APP_VERSION" "/DBundleDir=$(pwd -W)/dist-ci/BorsTerminal_Ultimate" installer/bors_setup.iss
          test -f "installer/out/BorsTerminal_Ultimate_Setup_v${APP_VERSION}.exe"
          sha256sum "installer/out/BorsTerminal_Ultimate_Setup_v${APP_VERSION}.exe" | tee installer-artifact.sha256

      - name: Installer runtime proof (temp directory only)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/out/BorsTerminal_Ultimate_Setup_v*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            # Controller-approved deviation: the setup include may be absent when
            # the release workflow does not restore it, so a missing local
            # installer artifact is reported, never fatal for the gate.
            Write-Output "::notice::installer/out/BorsTerminal_Ultimate_Setup_v*.exe absent; skipping the temp-directory install proof"
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "bt-install"
          $rt = Join-Path $env:RUNNER_TEMP "bt-rt"
          New-Item -ItemType Directory -Force $rt | Out-Null
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$dir","/PASSWORD=ci-test-only" -Wait
          $bad = Get-ChildItem -Recurse $dir -Include *.py,*.pyc,*.pyd,*.pyz,*.pyo,python*.exe,python*.dll,libpython* -ErrorAction SilentlyContinue
          if ($bad) { $bad | ForEach-Object { Write-Output "::error::python artifact: $($_.FullName)" }; exit 1 }
          Copy-Item "$dir/market.db" "$rt/market.db" -Force
          if (Test-Path "$dir/data") { Copy-Item -Recurse "$dir/data" "$rt/data" }
          go -C backend-go run ./cmd/runtimecheck --borsd "$dir/BorsTerminal_Ultimate.exe" --data-dir $rt --port 18082 --out "$env:RUNNER_TEMP/runtimecheck-installed.json"
          $uninst = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if ($uninst) { Start-Process -FilePath $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait }

      - name: Upload delivery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: delivery-artifacts
          path: |
            delivery-artifacts.sha256
            installer-artifact.sha256
            installer/out/BorsTerminal_Ultimate_Setup_v*.exe
          if-no-files-found: error

  # Phase 4.9.1 (Task A5): the job keeps its id and display name so any outside
  # required-check configuration stays valid, but it now runs the whole
  # Category-A lane.  Three of the four suites it used to name by hand were not
  # Category A after the A3/A4 classification: test_phase47_ingestion_v1.py and
  # candle_contract_v1071.py are C/DEPRECATE (report-only legacy lane) and
  # test_round18_history_repair_v1.py is B/KEEP (blocking data lane).  Keeping
  # them here would have kept retired suites in the release gate; the registry
  # is now the only place where the lane is decided.
  data-integrity:
    name: data integrity guards (ingestion / candles / backfill)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # One command, one source of truth: `--profile production` selects the 14
      # A-KEEP suites from dev/suite_registry.json (no JS suite, so no npm
      # install).  A hand-written list drifted from the registry once already.
      - name: Category-A production suites
        run: python dev/run_all_tests.py --profile production

  zero-python-runtime:
    name: zero-python runtime proof (Go process tree)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true
          cache-dependency-path: backend-go/go.sum

      - name: Build borsd
        working-directory: backend-go
        run: |
          mkdir -p ../dist-ci
          go build -o ../dist-ci/BorsTerminal_Ultimate.exe ./cmd/borsd

      - name: Launch borsd and prove no Python process
        shell: pwsh
        run: |
          $rt = Join-Path $env:RUNNER_TEMP "rt"
          New-Item -ItemType Directory -Force $rt | Out-Null
          Copy-Item market.db "$rt/market.db"
          go -C backend-go run ./cmd/runtimecheck --borsd ../dist-ci/BorsTerminal_Ultimate.exe --data-dir $rt --port 18081 --out "$env:RUNNER_TEMP/runtimecheck.json"
          if (-not (Test-Path "$env:RUNNER_TEMP/runtimecheck.json")) { Write-Output "::error::runtimecheck produced no report"; exit 1 }
          Get-Content "$env:RUNNER_TEMP/runtimecheck.json"

      - name: Upload runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: zero-python-runtime
          path: ${{ runner.temp }}/runtimecheck.json
          if-no-files-found: error

  frontend-v2:
    name: frontend v2 (typecheck / vitest / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Vitest Unit Tests
        run: npx vitest run

      - name: Build Production Bundle
        run: npm run build

  repo-hygiene:
    name: EOL / attributes / no tracked junk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .gitattributes must exist and pin LF + CRLF launchers
        run: |
          set -e
          test -f .gitattributes
          git check-attr eol -- app.py | grep -q 'eol: lf'
          git check-attr eol -- run_terminal.bat | grep -q 'eol: crlf'

      - name: No tracked file may be gitignored
        run: |
          set -e
          out=$(git ls-files -i -c --exclude-standard)
          if [ -n "$out" ]; then echo "ignored but tracked:"; echo "$out"; exit 1; fi

      - name: Nothing untracked may have crept in
        run: |
          set -e
          out=$(git ls-files --others --exclude-standard)
          if [ -n "$out" ]; then echo "untracked files:"; echo "$out"; exit 1; fi
