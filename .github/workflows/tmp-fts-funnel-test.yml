name: tmp FTS funnel frontend test

on:
  push:
    branches: ['main']

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run FTS funnel tests
        working-directory: frontend
        run: npm test -- --run src/__tests__/fts-funnel-stages.spec.tsx
