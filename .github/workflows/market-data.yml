name: Publish market data asset and Stage 4 snapshot

on:
  push:
    branches: [main]
    paths:
      - 'market.db.lzma'
      - '.github/workflows/market-data.yml'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Release Tag for Stage 4 Snapshot'
        required: false
        default: 'v1.0.98'

permissions:
  contents: read

jobs:
  publish-stage4-snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      DATA_REPO: johnwarchief/BorsTerminal
      TARGET_TAG: ${{ inputs.target_tag || 'v1.0.98' }}
      SOURCE_REF: 2e73cf1cec1f90bd965ecf59cca02f4295a15c8a
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require publishing secrets
        shell: bash
        run: |
          test -n "$GH_TOKEN" || { echo "::error::RELEASE_TOKEN is required"; exit 1; }
          test -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }

      - name: Build bors-producer binary
        shell: bash
        run: |
          cd backend-go
          go build -v -o ../bin/bors-producer ./cmd/bors-producer
          cd ..
          ./bin/bors-producer --version

      - name: Audit Minisign Secret Key Match (Zero Secret Exposure)
        shell: bash
        env:
          BORS_MINISIGN_SECRET_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BORS_MINISIGN_PASSWORD: ''
        run: |
          ./bin/bors-producer audit key

      - name: Prepare Stage 4 Snapshot Assets
        shell: bash
        run: |
          mkdir -p dist/snapshots

          # 1. Download market.db.lzma from data-latest
          echo "Downloading market.db.lzma from data-latest..."
          gh release download data-latest --repo "$DATA_REPO" -p "market.db.lzma" --dir dist/snapshots
          test -s dist/snapshots/market.db.lzma

          # 2. Download codal.db.lzma from target tag (or v1.0.98 baseline)
          echo "Downloading codal.db.lzma from $TARGET_TAG..."
          if ! gh release download "$TARGET_TAG" --repo "$DATA_REPO" -p "codal.db.lzma" --dir dist/snapshots 2>/dev/null; then
            echo "Falling back to v1.0.98 for codal.db.lzma..."
            gh release download v1.0.98 --repo "$DATA_REPO" -p "codal.db.lzma" --dir dist/snapshots
          fi
          test -s dist/snapshots/codal.db.lzma

          # 3. Generate manifest.json
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib

          tag = os.environ.get('TARGET_TAG', 'v1.0.98')
          p_market = pathlib.Path("dist/snapshots/market.db.lzma")
          p_codal = pathlib.Path("dist/snapshots/codal.db.lzma")

          manifest = {
              "snapshot_set_id": tag,
              "created_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "schema_version": 1,
              "assets": {
                  "market": {
                      "path": "market.db.lzma",
                      "sha256": hashlib.sha256(p_market.read_bytes()).hexdigest(),
                      "size_bytes": p_market.stat().st_size
                  },
                  "codal": {
                      "path": "codal.db.lzma",
                      "sha256": hashlib.sha256(p_codal.read_bytes()).hexdigest(),
                      "size_bytes": p_codal.stat().st_size
                  }
              }
          }
          out_file = pathlib.Path("dist/snapshots/manifest.json")
          out_file.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("Manifest generated:")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish and Sign Snapshot Set via bors-producer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BORS_MINISIGN_SECRET_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BORS_MINISIGN_PASSWORD: ''
        run: |
          ./bin/bors-producer codal publish \
            --tag="${TARGET_TAG}" \
            --manifest=dist/snapshots/manifest.json \
            --repo="${DATA_REPO}"

      - name: Verify Published Release Assets
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, subprocess, json
          tag = os.environ.get('TARGET_TAG', 'v1.0.98')
          repo = os.environ.get('DATA_REPO', 'johnwarchief/BorsTerminal')
          out = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "assets"], text=True)
          data = json.loads(out)
          asset_names = {a["name"]: a for a in data.get("assets", [])}
          required = [
              "market.db.lzma",
              "market.db.lzma.sig",
              "codal.db.lzma",
              "codal.db.lzma.sig",
              "manifest.json",
              "manifest.json.sig"
          ]
          missing = [r for r in required if r not in asset_names]
          if missing:
              print(f"::error::Missing required snapshot release assets: {missing}", file=sys.stderr)
              sys.exit(1)
          for r in required:
              print(f"[OK] Asset present in {tag}: {r} (size={asset_names[r]['size']})")
          print(f"::notice::[release-verified] All 6 Stage 4 snapshot assets successfully published to {repo} at {tag}")
          PY
