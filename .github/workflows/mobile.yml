name: mobile-apk
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'انتشار ریلیز + tag (پیش‌فرض false؛ اجرای عادی فقط artifact می‌سازد)'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'ریلیز را prerelease نگه دارد (کاندیدای آزمایشی)'
        type: boolean
        required: false
        default: true
      snapshot_series:
        description: 'tagِ بستهٔ داده‌ای که APK از آن می‌خواند (mobile-latest = کهنهٔ بی‌امضا؛ mobile-latest-v2 = سریِ امضاشده)'
        type: string
        required: false
        default: 'mobile-latest'
  push:
    branches:
      - 'arena/**'
    paths:
      - 'frontend/**'

# گیتِ انتشار (Stage 0 مأموریت اندروید): تا پیش‌ازِ این، همین workflow درِ هرِ
# push به frontend/** روی arena/** یکِ `gh release create` + tag می‌ساخت
# (`mobile-parity-<sha>`؛ شاهد: سطرِ A4 درِ docs/MASTER-EXECUTION-ROADMAP.md،
# ریلیزِ mobile-parity-f91b031). حالا اجرایِ عادی فقط artifact می‌دهد و
# انتشار/tag فقط با workflow_dispatch و publish=true، یعنی یکِ کلیکِ صریحِ دستی.
# الگویِ همان gating درِ release.yml (`if: github.event_name == 'workflow_dispatch'`) بود.

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # سریِ بستهٔ داده. پیش‌فرض همان چیزی است که امروز رویِ گوشی‌هاست
      # (`mobile-latest`، manifestِ چهارکلیدیِ بی‌امضا). سریِ جدیدِ v2 **مسیرِ
      # مستقل** است تا کلاینتِ کهنه هرگز با قراردادِ تازه روبه‌رو نشود؛
      # هیچ‌جا درِ این workflow چیزی رویِ `mobile-latest` منتشر یا بازنویسی
      # نمی‌شود — این job فقط *می‌خواند*.
      SNAPSHOT_SERIES: ${{ github.event.inputs.snapshot_series || 'mobile-latest' }}
      # مخزنِ src عمداً خصوصی می‌ماند (تصمیمِ مالک، 2026-10-15). پس هر چیزی که
      # بیرونِ CI خوانده می‌شود — بستۀ دادۀ گوشی و خودِ APKِ منتشرشده — باید درِ
      # مخزنِ عمومیِ توزیع باشد: آن‌جا token لازم نیست و لینک برایِ کاربر باز است.
      # خواندن درِ CI با gh/token می‌ماند، چون checkout خودِ مخزنِ خصوصی است.
      SERIES_REPO: johnwarchief/BorsTerminal
      PUBLISH_REPO: johnwarchief/BorsTerminal
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install mobile frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # ── منبعِ یکتایِ نسخۀ برنامه ─────────────────────────────────────────────
      # `frontend/package.json` تنها جایِ تعریفِ نسخۀ معنایی است (همان لنگرِ
      # dev/version_anchor_guard.py). از همین‌جا به سه مصرف‌کننده می‌رسد:
      #   • VITE_APP_VERSION → دروازۀ سازگاریِ کلاینت (localData.downloadToStaging)
      #   • BorsVersionName  → versionName درِ Gradle
      #   • BorsVersionCode  → مشتقِ یکنوا: major·1e6 + minor·1e3 + patch
      # Gradle هم خودِ package.json را می‌خواند و هر تزریقِ ناهمخوان را می‌شکند؛
      # این گام فقط پیش ازِ بیلد همان داوری را تکرار می‌کند تا خطا درِ لاگِ CI
      # معلوم باشد، نه درِ `gradlew`. بی‌این، نسخه‌هایِ متفاوتِ APK و manifest
      # ساکت از هم جدا می‌شدند (پیش‌ازِ این versionName "1.0" نوشتهٔ قالب بود).
      - name: "Canonical app version (single source — frontend/package.json)"
        id: ver
        run: |
          set -e
          V=$(node -p "JSON.parse(require('fs').readFileSync('frontend/package.json','utf8')).version")
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "نسخۀ رسمی نامعتبر است: '$V' (x.y.z لازم است)" >&2; exit 1;;
          esac
          MAJ=${V%%.*}; REST=${V#*.}; MIN=${REST%%.*}; PAT=${REST#*.}
          case "$MIN$PAT" in (*[!0-9]*|'') echo "جزءهای نسخۀ عددی نیستند: $V" >&2; exit 1;; esac
          if [ "$MIN" -ge 1000 ] || [ "$PAT" -ge 1000 ]; then
            echo "minor/patch باید <۱۰۰۰ بماند تا versionCode یکتا باشد: $V" >&2; exit 1
          fi
          CODE=$(( MAJ * 1000000 + MIN * 1000 + PAT ))
          if [ "$CODE" -le 0 ] || [ "$CODE" -gt 2100000000 ]; then
            echo "versionCode نامعتبر از $V: $CODE" >&2; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "APP_VERSION=$V"
            echo "APP_VERSION_CODE=$CODE"
            echo "VITE_APP_VERSION=$V"
            echo "BORS_VERSION_NAME=$V"
            echo "BORS_VERSION_CODE=$CODE"
          } >> "$GITHUB_ENV"
          echo "منبعِ واحدِ نسخه: frontend/package.json → $V (versionCode $CODE)"

      # گیتِ تست: بدونِ این، گاردهایِ موبایل (انتخابگرِ مرده، resolver آفلاین،
      # برابریِ تیب، روتِ قیف) هیچ‌وقت درِ CI اجرا نمی‌شدند و APK از رویِ کدِ
      # قرمز ساخته می‌شد. صفرِ خطا درِ tsc شرطِ ساختِ اپ است.
      - name: Type-check and run the frontend suite
        working-directory: frontend
        run: |
          npx tsc -b
          npx vitest run

      - name: Build mobile frontend
        working-directory: frontend
        env:
          # کلیدِ عمومیِ امضایِ manifest داده (فقط public؛ کلیدِ خصوصی درِ repo نیست).
          # بی‌این، کلاینت هیچ ریلیزی را نمی‌پذیرد (fail-closed) — پس بیلدِ بدونِ
          # کلید، بیلدی است که هرگز تازه نمی‌شود؛ انتشار با publish=true پایین
          # همان‌جا بسته می‌شود.
          VITE_MOBILE_MANIFEST_PUBKEY: ${{ vars.MOBILE_MANIFEST_PUBKEY }}
        run: |
          set -e
          export VITE_BUILD_TAG="uiux-${GITHUB_SHA::7} · run${GITHUB_RUN_NUMBER}"
          # مهرِ بستۀ داده (built_at از meta.json کنارِ همان gz): گوشی با آن
          # می‌فهمد نسخۀ کشیدۀ پس‌زمینه از بستۀ همراهِ APK تازه‌تر است یا نه.
          # بی‌مهر، نسخۀ کهنۀ کشیده‌شده بر APKِ تازه می‌برد (localData.ts).
          BASE="https://github.com/${SERIES_REPO}/releases/download/${SNAPSHOT_SERIES}"
          # بستۀ داده با `gh release download` خوانده می‌شود؛ بی‌این روی مخزنِ
          # خصوصی 404 می‌داد (شاهد: ران‌های 38778336195 و 38778341353).
          mkdir -p _snap
          gh release download "$SNAPSHOT_SERIES" --repo "$SERIES_REPO" \
            --pattern mobile_snapshot.db.meta.json --dir _snap --clobber 2>/dev/null || true
          STAMP=$(python3 -c 'import json;print(json.load(open("_snap/mobile_snapshot.db.meta.json",encoding="utf-8"))["built_at"])' 2>/dev/null || true)
          export VITE_SNAPSHOT_STAMP="$STAMP"
          # کلاینت هم دقیقاً همان سری را می‌خواند که APK از آن پخته شده؛
          # بی‌این، بیلدِ سریِ تازه درِ برنامه هنوز mobile-latestِ کهنه را چک می‌کرد.
          export VITE_SNAPSHOT_REMOTE="$BASE"
          # سری، درِ خودِ manifest هم نوشته می‌شود (`--series` درِ سازنده) و
          # کلاینت ناهمخوان را رد می‌کند (`checkSeries`) — پس «URL درست بود ولی
          # بستۀ نسلِ دیگر بود» ساکت نمی‌گذرد.
          export VITE_SNAPSHOT_SERIES="$SNAPSHOT_SERIES"
          echo "snapshot series=$SNAPSHOT_SERIES remote=$BASE"
          VITE_LOCAL_DATA=1 npm run build
          gh release download "$SNAPSHOT_SERIES" --repo "$SERIES_REPO" \
            --pattern mobile_snapshot.db.gz --dir dist --clobber
          test -s dist/mobile_snapshot.db.gz
          SNAP_BYTES=$(stat -c '%s' dist/mobile_snapshot.db.gz)
          echo "snapshot stamp=${STAMP:-none} bytes=$SNAP_BYTES"
          # سنجشِ صادقِ مسیرِ گوشی: همان URL، این‌بار بی‌هیچ اعتبارنامه‌ای.
          ANON=$(curl -s -o /dev/null -w '%{http_code}' -IL "$BASE/mobile_snapshot.db.gz" || echo 000)
          {
            echo "### بستۀ داده: دسترسیِ ناشناس (مسیرِ خودِ گوشی)"
            echo "- series: \`$SNAPSHOT_SERIES\` · anon HTTP \`$ANON\` · CI download: ok ($SNAP_BYTES B)"
            if [ "$ANON" != "200" ]; then
              echo "- **BLOCKED for end users**: مخزنِ \`$SERIES_REPO\` خصوصی است؛ هیچ APK منتشرشده‌ای نمی‌تواند دادهٔ تازه بگیرد تا یا مخزن عمومی شود یا سریِ داده به مخزنِ عمومیِ \`johnwarchief/BorsTerminal\` منتقل شود."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # قدمِ بسته درِ متنِ ریلیز هم نوشته می‌شود: «کدام دادۀ داخلِ APK است»
          # بی‌این عدد درِ ریلیز قابلِ استناد نیست.
          echo "SNAP_STAMP=${STAMP:-none}" >> "$GITHUB_ENV"
          echo "SNAP_BYTES=$SNAP_BYTES" >> "$GITHUB_ENV"

      # راستی‌آزماییِ خروجیِ واقعیِ vite، نه متغیرهایِ YAML: نسخۀ رسمی باید درِ
      # فایل‌هایِ بیلدشده باشد (وگرنه دروازۀ سازگاریِ کلاینت بی‌صدا «نسخۀ نامعلوم»
      # می‌گیرد و هیچ ریلیزی را نمی‌پذیرد).
      - name: Verify the built bundle carries the canonical version
        working-directory: frontend
        run: |
          set -e
          if [ -z "$VITE_APP_VERSION" ]; then
            echo "VITE_APP_VERSION خالی است؛ نسخۀ نامعلوم هرگز سازگار فرض نمی‌شود" >&2; exit 1
          fi
          HIT=$(grep -rl -- "$VITE_APP_VERSION" dist/assets 2>/dev/null | head -1 || true)
          if [ -z "$HIT" ]; then
            echo "نسخۀ $VITE_APP_VERSION درِ هیچ فایلِ بیلدشده‌ای پیدا نشد ⇒ تزریق نشسته" >&2; exit 1
          fi
          echo "نسخۀ بیلدشده در $HIT"

      # ── اصالتِ بستۀ داده درِ CI ──────────────────────────────────────────────
      # گوشی بی‌امضایِ معتبر هیچ بستۀ بیرونی را فعال نمی‌کند
      # (`manifestSignature.ts` + `localData.fetchSignedManifest`). اگر همین‌جا
      # هم بررسی نشود، APK ای می‌سازیم که *می‌دانیم* دادهٔ تازه نمی‌گیرد.
      # continue-on-error: اسنپ‌شاتِ منتشرشدهٔ امروز (mobile-latest) هنوز بی‌امضاست؛
      # بیلدِ کاندید نباید بشکند، اما گیتِ انتشار پایین همان را می‌بندد.
      - name: Verify the data package signature
        id: sigcheck
        continue-on-error: true
        env:
          PUB: ${{ vars.MOBILE_MANIFEST_PUBKEY }}
        run: |
          set -e
          mkdir -p _sigcheck
          gh release download "$SNAPSHOT_SERIES" --repo "$SERIES_REPO" \
            --pattern mobile_snapshot.db.meta.json --dir _sigcheck --clobber
          mv _sigcheck/mobile_snapshot.db.meta.json _sigcheck/meta.json
          if ! gh release download "$SNAPSHOT_SERIES" --repo "$SERIES_REPO" \
               --pattern mobile_snapshot.db.meta.json.sig --dir _sigcheck --clobber 2>/dev/null; then
            echo "فایلِ .sig کنارِ manifest منتشر نشده ⇒ بستۀ داده بی‌امضا است" >&2; exit 2
          fi
          mv _sigcheck/mobile_snapshot.db.meta.json.sig _sigcheck/meta.json.sig
          if [ -z "$PUB" ]; then
            echo "vars.MOBILE_MANIFEST_PUBKEY تنظیم نشده ⇒ بررسیِ اصالت ممکن نیست" >&2; exit 3
          fi
          python3 scripts/sign_mobile_manifest.py --verify --in _sigcheck/meta.json \
            --sig _sigcheck/meta.json.sig --pubkey-b64 "$PUB"
          echo "signed=verified" >> "$GITHUB_OUTPUT"

      - name: Record the data package identity
        run: |
          set -e
          mkdir -p _ident
          gh release download "$SNAPSHOT_SERIES" --repo "$SERIES_REPO" \
            --pattern mobile_snapshot.db.meta.json --dir _ident --clobber 2>/dev/null || true
          cp _ident/mobile_snapshot.db.meta.json /tmp/meta.json 2>/dev/null || true
          if [ -s /tmp/meta.json ]; then
            python3 -c 'import json;m=json.load(open("/tmp/meta.json",encoding="utf-8"));e={"SNAP_PACKAGE_ID":m.get("package_id"),"SNAP_SCHEMA_VERSION":m.get("schema_version"),"SNAP_DB_SCHEMA":m.get("db_schema"),"SNAP_BUILT_AT":m.get("built_at"),"SNAP_GZ_SHA":str(m.get("gz_sha256",""))[:16]};[print("%s=%s"%(k,v)) for k,v in e.items()]' >> "$GITHUB_ENV"
          else
            echo "SNAP_PACKAGE_ID=none" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ── کلیدِ امضایِ انتشار: سازوکارِ رسمی، بی‌افشایِ رمز ───────────────────
      # دو secret لازم است (هیچ‌کدام امروز تنظیم نشده؛ تا تنظیم نشود بیلدِ
      # release **بی‌امضا** می‌ماند و دروازۀ انتشار پایین همان را می‌بندد):
      #   ANDROID_RELEASE_KEYSTORE_B64 — خودِ keystore، base64
      #   ANDROID_RELEASE_KEYSTORE_PROPS — سه سطرِ storePassword/keyAlias/keyPassword
      # رمز هرگز درِ فرمانِ gradlew نمی‌آید (فهرستِ فرآیندها آن را نشان می‌دهد):
      # فایلِ properties با umask 077 درِ RUNNER_TEMP نوشته می‌شود و مسیرش از
      # راهِ متغیرِ محیطی به Gradle می‌رسد.
      - name: Materialize the release keystore (if the project key exists)
        env:
          KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KS_PROPS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PROPS }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PROPS" ]; then
            echo "release signing = ABSENT؛ releases امضانشده منتشر نمی‌شوند (دروازۀ publish بسته می‌ماند)"
            exit 0
          fi
          umask 077
          # secretِ بدشکل نباید به «base64: invalid input» و شکستِ مبهمِ بیلد
          # بیانجامد: رانِ 38808582245 همان را دید (patternِ gh secret set که
          # به‌جایِ مقدار، رشته‌یِ «-» را ذخیره کرده بود). پس اول شکل، بعد رمزگشایی.
          if ! printf '%s' "$KS_B64" | grep -qE '^[A-Za-z0-9+/]+={0,2}$'; then
            echo "BLOCKED: ANDROID_RELEASE_KEYSTORE_B64 base64 نیست (طول ${#KS_B64})؛ دوباره publish-secrets را اجرا کنید" >&2
            exit 1
          fi
          d="$RUNNER_TEMP/bors-keystore"; mkdir -p "$d"
          printf '%s' "$KS_B64" | base64 -d > "$d/release.keystore"
          test -s "$d/release.keystore" || { echo "BLOCKED: keystore رمزگشایی نشد (خروجی خالی)" >&2; exit 1; }
          { echo "storeFile=$d/release.keystore"; printf '%s\n' "$KS_PROPS"; } > "$d/keystore.properties"
          echo "BORS_KEYSTORE_PROPERTIES=$d/keystore.properties" >> "$GITHUB_ENV"
          echo "release signing = configured (path only; values never printed)"

      - name: Sync Capacitor and build Release + Debug APKs
        working-directory: frontend
        run: |
          set -e
          npx cap sync android
          cd android
          chmod +x gradlew
          # نسخۀ رسمی: assembleRelease. اگر کلید نبود، بی‌امضا می‌ماند — و هرگز
          # به debug.keystore برنمی‌گردد (بیلدِ debug جایِ کلیدِ انتشار را نمی‌گیرد).
          ./gradlew assembleRelease --no-daemon \
            -PBorsVersionName="$BORS_VERSION_NAME" -PBorsVersionCode="$BORS_VERSION_CODE"
          # bیلدِ debug فقط برایِ آزمونِ WebView رویِ شبیه‌ساز لازم است: DevTools
          # تنها درِ buildِ debuggable باز می‌شود، پس اندازه‌گیریِ DOM/console/inset
          # از همان ساخته می‌آید و درِ گزارش «آزمونِ artifact رسمی» حساب نمی‌شود.
          ./gradlew assembleDebug --no-daemon \
            -PBorsVersionName="$BORS_VERSION_NAME" -PBorsVersionCode="$BORS_VERSION_CODE"

      # Gradle را باور نمی‌کنیم: AndroidManifestِ ادغام‌شده‌ای که واقعاً درِ APK
      # رفته خوانده می‌شود (metadataِ نهایی، نه YAML).
      - name: Verify the APK metadata carries the canonical version
        run: |
          set -e
          MAN=$(find frontend/android/app/build/intermediates -name AndroidManifest.xml \
                -path '*merged_manifest*' -path '*elease*' | head -1)
          if [ -z "$MAN" ]; then echo "merged AndroidManifest نسخۀ release پیدا نشد" >&2; exit 1; fi
          VN=$(grep -o 'android:versionName="[^"]*"' "$MAN" | head -1 | sed 's/.*="\(.*\)"/\1/')
          VC=$(grep -o 'android:versionCode="[^"]*"' "$MAN" | head -1 | sed 's/.*="\(.*\)"/\1/')
          echo "manifest: versionName=$VN versionCode=$VC ($MAN)"
          [ "$VN" = "$BORS_VERSION_NAME" ] || { echo "versionName درِ APK ($VN) ≠ نسخۀ رسمی ($BORS_VERSION_NAME)" >&2; exit 1; }
          [ "$VC" = "$BORS_VERSION_CODE" ] || { echo "versionCode درِ APK ($VC) ≠ مشتقِ رسمی ($BORS_VERSION_CODE)" >&2; exit 1; }

      # ── اعتبارسنجیِ artifact رسمی از ریلِ خودِ Android ───────────────────────
      # aapt2/apksigner حرفِ Gradle را باور نمی‌کنند: بسته‌ای که خوانده می‌شود
      # همان بسته‌ای است که باید رویِ گوشی برود. سه چیز همین‌جا ثبت می‌شود و
      # بعداً درِ متنِ ریلیز می‌نشیند: امضا (با اثرانگشتِ گواهی)، نبودِ
      # `debuggable`، و فهرستِ مجوزها.
      - name: Validate the release artifact (aapt2 + apksigner)
        id: relcheck
        run: |
          set -e
          # نامِ فایل خودش مدرک است: بی‌کلید، AGP فایلِ
          # «app-release-unsigned.apk» می‌سازد و با کلید «app-release.apk».
          # پس نه فرضِ سختِ نام، نه باورِ Gradle: فایلِ واقعیِ خروجی پیدا و
          # سپس با aapt2/apksigner خوانده می‌شود.
          APK=$(ls -1 frontend/android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "هیچ APK درِ outputs/apk/release ساخته نشد" >&2; exit 1; fi
          echo "release artifact: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then echo "build-tools درِ runner نیست" >&2; exit 1; fi
          echo "== badging =="
          "$BT/aapt2" dump badging "$APK" | grep -E '^package:|^sdkVersion:|^targetSdkVersion:|^uses-permission:|debuggable|^application-label' || true
          BADGE=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGE" | grep -q "^package: name='com.borsterminal.mobile'" \
            || { echo "applicationId درِ APK درست نیست" >&2; exit 1; }
          echo "$BADGE" | grep -q "versionCode='$BORS_VERSION_CODE'" \
            || { echo "versionCode درِ APK ($BORS_VERSION_CODE) نیست" >&2; exit 1; }
          echo "$BADGE" | grep -q "versionName='$BORS_VERSION_NAME'" \
            || { echo "versionName درِ APK نیست" >&2; exit 1; }
          if echo "$BADGE" | grep -qw debuggable; then
            echo "APK ریلیز debuggable است؛ نسخۀ رسمی هرگز نباید باشد" >&2; exit 1
          fi
          echo "== signing =="
          # سیاستِ شبکه درِ AGP 8 به‌صورت فایلِ res/xml/* درِ APK نمی‌ماند (درِ
          # resources.arsc درون‌خطی می‌شود). بی‌این سطر، «res/xml خالی است» به
          # حسابِ نبودِ network_security_config گذاشته می‌شود — دامِ همین دور.
          python3 - "$APK" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          arsc = z.read("resources.arsc")
          if b"network_security_config" not in arsc:
              print("network_security_config درِ resources.arsc نیست ⇒ بستۀ امنیتیِ شبکه بیلد نشده", file=sys.stderr)
              sys.exit(1)
          pub = [n for n in z.namelist() if n.startswith("assets/public/") and n.endswith(".js")]
          bad = [n for n in pub if any(k in z.read(n).decode("utf-8", "replace")
                             for k in ("bors123", "DEFAULT_PASS", "DEFAULT_USER"))]
          if bad:
              print("اعتبارنامۀ ثابت درِ باندلِ APK: " + ",".join(bad[:3]), file=sys.stderr)
              sys.exit(1)
          print("packaged: network_security_config درِ resources.arsc · %d فایل js بی‌اعتبارنامۀ ثابت" % len(pub))
          PY
          SUM=$(sha256sum "$APK" | cut -d' ' -f1); SIZE=$(stat -c '%s' "$APK")
          echo "artifact: $APK · $SIZE بایت · sha256 $SUM"
          SIGNED=no; CERT=namoloom
          if "$BT/apksigner" verify --print-certs "$APK" > /tmp/verify.txt 2>&1; then
            SIGNED=yes
            CERT=$(grep -m1 -oE 'SHA-256 digest: [0-9a-f]+' /tmp/verify.txt | cut -d' ' -f3)
            [ -n "$CERT" ] || CERT=namoloom
            grep -E '^(Verified using|Signer #1 certificate DN|Signer #1 certificate SHA-256 digest)' /tmp/verify.txt || true
          else
            echo "APK بی‌امضاست (دروازۀ publish همین را می‌بیند)"; tail -3 /tmp/verify.txt || true
          fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT" >> "$GITHUB_OUTPUT"
          {
            echo "APK_SHA256=$SUM"
            echo "APK_SIZE=$SIZE"
            echo "APK_SIGNED=$SIGNED"
            echo "APK_CERT_SHA256=$CERT"
          } >> "$GITHUB_ENV"

      # امضای APK و امضای manifest دو سازوکارِ جدااند و هرکدام مستقل سنجیده
      # می‌شود. این گام هویتِ کلیدِ APK را می‌خواند، نه فقط «امضا دارد»:
      # اثرانگشتِ گواهی باید با vars.ANDROID_RELEASE_CERT_SHA256 (کلیدِ عمومیِ
      # انتشار، بدونِ رمز) بخورد. بی‌var ⇒ NOT_VERIFIED؛ با var و بی‌مصرف ⇒ رد.
      - name: Verify the release certificate identity
        env:
          EXPECT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -e
          APK=$(ls -1 frontend/android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p _audit/android_release
          ARGS=(--json _audit/android_release/cert_release.json)
          if [ -n "$EXPECT" ]; then ARGS+=(--expect-fingerprint "$EXPECT"); fi
          # `|| true` عمداً بیرون ازِ set -e نگه داشته شد: کرشِ خواننده باید به
          # دستِ خودِ گام برسد و باِ پیامِ «خواننده خراب است» بمیرد، نه با
          # FileNotFoundErrorِ بی‌سروصدا که «گواهی نمی‌خواند» را از «ابزار کرش
          # کرد» جدا نمی‌کند. این تفکیک امنیتی است، نه آرایشی.
          RC=0
          python3 tools/apk_cert_fingerprint.py "$APK" "${ARGS[@]}" 2>&1 | tee _audit/android_release/cert_reader.log || RC=$?
          if [ ! -s _audit/android_release/cert_release.json ]; then
            echo "READER-FAILED: خودِ ابزارِ خواندنِ گواهی خروجیِ JSON نساخت (rc=$RC)" >> "$GITHUB_STEP_SUMMARY"
            echo "آخرینِ خواننده:" >&2; tail -12 _audit/android_release/cert_reader.log >&2
            exit 1
          fi
          V=$(python3 -c 'import json,sys;print(json.load(open("_audit/android_release/cert_release.json",encoding="utf-8"))["verdict"])')
          echo "certificate identity: $V (expected=${EXPECT:-none})" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$EXPECT" ]; then
            echo "NOT_VERIFIED: اثرانگشتِ کلیدِ انتشار درِ vars ثبت نشده ⇒ نمی‌توان ادعا کرد این APK با کلیدِ رسمیِ مالک امضا شده" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$V" != "SIGNED-MATCH" ]; then
            echo "گواهیِ امضای APK با کلیدِ انتشارِ ثبت‌شده نمی‌خواند: $V" >&2
            exit 1
          fi

      - name: Upload release + debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bors-mobile-candidate-${{ github.sha }}
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish gate status
        env:
          PUB: ${{ vars.MOBILE_MANIFEST_PUBKEY }}
          VERIFIED: ${{ steps.sigcheck.outputs.signed }}
        run: |
          # سه قفلِ مستقل، هر سه باید باز شوند: (۱) کلیدِ عمومیِ manifest درِ باندل
          # هست، (۲) بستۀ دادۀ هدف امضایش معتبر است، (۳) APK با کلیدِ *انتشار*
          # امضا شده. سومیا تا پیش‌ازِ این وجود نداشت: CI فقط app-debug.apk
          # می‌ساخت و منتشر می‌کرد — یعنی نسخۀ «رسمی» رویِ گوشی با debug keystore
          # امضا می‌شد و گواهی‌اش درِ هرِ ران عوض می‌شد (ارتقایِ درجا ناممکن).
          echo "release APK signing: ${APK_SIGNED:-no} · certificate sha256: ${APK_CERT_SHA256:-نامعلوم}"
          echo "data package series: $SNAPSHOT_SERIES · manifest signature: ${VERIFIED:-unchecked}"
          echo "bundle trust root: $([ -n "$PUB" ] && echo configured || echo ABSENT)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "PUBLISH = صریحاً درخواست‌شده (workflow_dispatch, publish=true)"
            if [ "$APK_SIGNED" != "yes" ]; then
              echo "BLOCKED: APK امضایِ انتشار ندارد (secrets.ANDROID_RELEASE_KEYSTORE_B64/PROPS تنظیم نشده). APKِ بی‌امضا یا debug به‌عنوان نسخۀ رسمی منتشر نمی‌شود." >&2
              exit 1
            fi
            if [ -z "$PUB" ]; then
              echo "BLOCKED: vars.MOBILE_MANIFEST_PUBKEY تنظیم نشده؛ کلیدِ آزمایشی جایِ کلیدِ انتشار را نمی‌گیرد." >&2
              exit 1
            fi
            if [ "$VERIFIED" != "verified" ]; then
              echo "BLOCKED: امضایِ بستۀ داده بررسی/معتبر نشد؛ انتشارِ APKِ بی‌منبعِ اعتماد ممنوع." >&2
              exit 1
            fi
          else
            echo "PUBLISH = رد شد؛ اینِ ران فقط artifact می‌سازد. برایِ tag/ریلیز: Run workflow با publish=true."
          fi

      # کلیدِ عمومی باید درِ خودِ باندلِ همراهِ APK نشسته باشد (ثابتِ build-time،
      # نه چیزی که زمانِ اجرا از همان منبعِ بسته خوانده شود).
      - name: Verify the bundled public key
        env:
          PUB: ${{ vars.MOBILE_MANIFEST_PUBKEY }}
        run: |
          set -e
          if [ -z "$PUB" ]; then
            echo "کلیدِ عمومی تنظیم نشده ⇒ بیلد بی‌ریشۀ اعتماد ساخته می‌شود (کاندید)" >&2
            exit 0
          fi
          if ! grep -rlq -- "$PUB" frontend/dist/assets; then
            echo "کلیدِ عمومی درِ هیچ فایلِ بیلدشده‌ای نیست ⇒ دروازۀ اصالت درِ گوشی بسته می‌ماند" >&2
            exit 1
          fi
          echo "کلیدِ عمومی درِ باندل نشسته است"

      - name: Publish Android release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
        env:
          # ریلیزِ اندروید درِ مخزنِ *عمومیِ* توزیع ساخته می‌شود تا لینکِ APK برایِ
          # کاربر بدونِ هیچ اعتبارنامه‌ای باز باشد؛ tokenِ خودِ کارفرما به آن مخزن
          # نوشتن نمی‌کند، پس RELEASE_TOKEN (همان که دسکتاپ را منتشر می‌کند).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERIFIED: ${{ steps.sigcheck.outputs.signed }}
          PUB: ${{ vars.MOBILE_MANIFEST_PUBKEY }}
        run: |
          set -e
          # دروازۀ انتشار درِ *همین* گام هم بازخوانی می‌شود، نه فقط درِ گامِ
          # «Publish gate status»: آن گام با exit 1 شغل را می‌بندد، ولی اعتماد به
          # ترتیبِ گام‌ها یعنی یکِ جابه‌جاییِ بعدی، انتشارِ بی‌کلید. چهار شرط، هر
          # چهار همین‌جا: APK امضاشده، کلیدِ عمومی درِ باندل، امضایِ بستۀ داده
          # معتبر، و سریِ هدف کهنه/خالی نیست.
          if [ "$APK_SIGNED" != "yes" ]; then
            echo "BLOCKED: APK امضایِ انتشار ندارد؛ نسخۀ رسمی با debug keystore یا بی‌امضا منتشر نمی‌شود." >&2
            exit 1
          fi
          if [ -z "$PUB" ]; then
            echo "BLOCKED: vars.MOBILE_MANIFEST_PUBKEY تنظیم نشده؛ APK بی‌ریشۀ اعتماد منتشر نمی‌شود." >&2
            exit 1
          fi
          if [ "$VERIFIED" != "verified" ]; then
            echo "BLOCKED: امضایِ بستۀ داده معتبر نشد (sig-check زودتر رد شد)؛ انتشار ممنوع." >&2
            exit 1
          fi
          case "$SNAPSHOT_SERIES" in
            mobile-latest|data-latest|"")
              echo "BLOCKED: سریِ هدف '$SNAPSHOT_SERIES' سریِ کهنه/خالی است؛ این workflow هرگز سری منتشرشدۀ گوشی‌ها را بازنویسی نمی‌کند." >&2
              exit 1;;
          esac
          SHA="${GITHUB_SHA::7}"
          PRERELEASE_FLAG="--prerelease"
          if [ "${{ github.event.inputs.prerelease }}" = "false" ]; then
            # این مخزنِ عمومی، مقصدِ آپدیتِ دسکتاپ هم هست: api/update.py:66
            # `releases/latest/download/latest.json` را می‌خواند و آن مسیر «آخرین
            # ریلیزِ غیرپیش‌انتشار» است. یک ریلیزِ android به‌عنوان stable درِ همین
            # مخزن، latest.json دسکتاپ را می‌پوشاند و هر آپدیتِ ویندوزی 404 می‌گیرد.
            # پس ریلیزِ اندروید همیشه prerelease است؛ لینکِ دانلودِ مستقیمِ آن برایِ
            # کاربر عادی ثابت و باز می‌ماند.
            echo "BLOCKED: prerelease=false درِ این مخزن مجاز نیست؛ ریلیزِ stableِ اندروید مسیرِ releases/latest/download/latest.json دسکتاپ را می‌پوشاند. با prerelease=true منتشر کنید." >&2
            exit 1
          fi
          # base_main_commit = جایی که این شاخه از main جدا شده؛ بی‌این، ریلیزِ
          # موبایل قابلِ ردیابی به کدِ دسکتاپ نیست
          git fetch -q origin main
          BASE=$(git merge-base origin/main "$GITHUB_SHA")
          APK=$(ls -1 frontend/android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "هیچ APK ریلیزی برایِ انتشار نیست" >&2; exit 1; fi
          case "$(basename "$APK")" in
            *unsigned*) echo "BLOCKED: فایلِ پیدا شده بی‌امضاست ($(basename "$APK"))؛ منتشر نمی‌شود." >&2; exit 1;;
          esac
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c '%s' "$APK")
          # نامِ artifactِ gradle همیشه `app-release.apk` است. `gh release upload
          # "$APK#نام"` رویِ این نسخهٔ gh بی‌خطا رد شد و asset با همان نامِ gradle
          # منتشر شد (شاهد: رانِ ۳۸۸۱۵۵۰۴۲۵۵ → asset = app-release.apk، لینکِ
          # وعده‌داده‌شده درِ notes = 404). پس فایلِ منتشرشدنی جدا نام‌گذاری می‌شود؛
          # bytes دست‌نخورده‌اند و sha256 همان می‌ماند.
          PUB_NAME="bors-terminal-android-$BORS_VERSION_NAME.apk"
          cp "$APK" "./$PUB_NAME"
          [ "$(sha256sum "./$PUB_NAME" | cut -d' ' -f1)" = "$SUM" ] || { echo "نام‌گذاریِ artifact بایت‌ها را عوض کرد" >&2; exit 1; }
          TAG="android-$BORS_VERSION_NAME"
          # idempotent: اگر رانِ پیشین ریلیز را ساخته و درِ گامِ بعد مرد باشد،
          # `create` با «already exists» می‌مرد و نسخهٔ درست هرگز منتشر نمی‌شد.
          # ریلیزِ منتشرشده هرگز حذف یا بازنویسی نمی‌شود؛ فقط asset تازه می‌گیرد.
          if gh release view "$TAG" --repo "$PUBLISH_REPO" >/dev/null 2>&1; then
            echo "ریلیز $TAG از پیش موجود است ⇒ create رد می‌شود، asset به‌روز می‌شود"
            SKIP_CREATE=1
          else
            SKIP_CREATE=0
          fi
          # tag مستقلِ اندروید: «android-<version>» هیچ‌وقت با برچسبِ دسکتاپ
          # (vX.Y.Z) یا با سریِ دادۀ منتشرشده (mobile-latest / data-latest)
          # نمی‌خواند، پس این ریلیز هیچ asset ویندوزی و هیچ latest.json را
          # لمس نمی‌کند.
          # بی‌`--target`: ریلیز درِ مخزنِ *عمومیِ* توزیع ساخته می‌شود و برچسب هم
          # همان‌جا ایجاد می‌شود؛ `--target $GITHUB_SHA` آن SHA را می‌خواست که فقط درِ
          # مخزنِ خصوصیِ سورس وجود دارد ⇒ GitHub سه خطا می‌داد و هیچ‌کدام معنایِ
          # «گواهی بد است» نداشت:
          #   tag_name is not a valid tag / Published releases must have a valid tag
          #   / Release.target_commitish is invalid
          # پس برچسب رویِ branch پیش‌فرضِ همان مخزنِ مقصد می‌نشیند و شناسۀ واقعیِ
          # سورس درِ notes ثبت می‌شود (ردیابی با متن، نه با refِ بی‌وجود).
          DOWNLOAD="https://github.com/$PUBLISH_REPO/releases/download/$TAG/bors-terminal-android-$BORS_VERSION_NAME.apk"
          mkdir -p _pubcheck
          cat > _pubcheck/release_notes.md <<NOTES_EOF
          نسخۀ اندروید (بستۀ تجمیعی، نه per-fix). امضا با کلیدِ انتشارِ پروژه، نه debug keystore.

          نصب: $DOWNLOAD
          sha256: $SUM · $SIZE بایت
          applicationId: com.borsterminal.mobile · versionName $BORS_VERSION_NAME · versionCode $BORS_VERSION_CODE (منبع: frontend/package.json)
          گواهیِ امضا (sha256): ${APK_CERT_SHA256:-نامعلوم}
          ارتقا: اگر نسخۀ قبلی با کلیدِ دیگری امضا شده باشد، اندروید نصبِ رو‌رویی را رد می‌کند (INSTALL_FAILED_UPDATE_INCOMPATIBLE) و باید نسخۀ قبلی حذف شود. کلیدِ این ریلیز از این پس ثابت می‌ماند؛ ریلیزهایِ بعدیِ همان applicationId رویِ این نسخه رو‌رویی نصب می‌شوند.
          source commit: $GITHUB_SHA
          base_main_commit: $BASE
          build: frontend tsc + vitest سبز، vite build (VITE_LOCAL_DATA=1)، gradlew assembleRelease، aapt2 + apksigner verify
          snapshot داده: ${SNAPSHOT_SERIES} · ${SNAP_BYTES} بایت · built_at ${SNAP_STAMP} · package_id ${SNAP_PACKAGE_ID:-نامعلوم} · schema ${SNAP_SCHEMA_VERSION:-?}/db ${SNAP_DB_SCHEMA:-?} · gz sha ${SNAP_GZ_SHA:-?}…
          امضایِ manifest: ${VERIFIED:-بررسی‌نشده} (کلیدِ عمومی درِ باندل بیلد نشسته است؛ کلیدِ خصوصی درِ مخزن نیست)
          وضعیتِ آیتم‌ها و شاهد هر کدام: docs/android/ANDROID-RELEASE-REPORT-2026-10-15.md
          NOTES_EOF
          [ "$SKIP_CREATE" = "1" ] || gh release create "$TAG" $PRERELEASE_FLAG --repo "$PUBLISH_REPO" --title "BorsTerminal Android $BORS_VERSION_NAME — نسخۀ امضاشدۀ رسمی" --notes-file _pubcheck/release_notes.md
          # notes همیشه دوباره نوشته می‌شود: مسیر idempotent create را رد می‌کند
          # و اگر متن تازه نشود، ریلیز هشِ buildِ قبلی را نگه می‌دارد و لینکش به
          # فایلِ دیگری می‌رود — شاهد: android-1.1.0 با sha 5655afa1 ماند درحالی‌که
          # asset رسمی 4adca360 شده بود. کاربری که هش را از یادداشت برمی‌دارد هیچ‌وقت
          # فایلِ واقعی را تأیید نمی‌کرد.
          gh release edit "$TAG" --repo "$PUBLISH_REPO" --notes-file _pubcheck/release_notes.md
          gh release view "$TAG" --repo "$PUBLISH_REPO" --json body --jq ".body" | grep -q "$SUM" || { echo "متن ریلیز هنوز هشِ این build را ندارد" >&2; exit 1; }
          gh release upload "$TAG" "./$PUB_NAME" --repo "$PUBLISH_REPO" --clobber
          # همان چیزی که لینکِ notes وعده می‌دهد باید واقعاً درِ assetها باشد؛
          # بی‌این چک، gh می‌تواند نام را عوض کند و گامِ بعدی با 404 می‌مرد.
          gh release view "$TAG" --repo "$PUBLISH_REPO" --json assets --jq '.assets[].name' | grep -qx "$PUB_NAME" || { echo "asset با نام $PUB_NAME منتشر نشد" >&2; exit 1; }

          # ── راستی‌آزماییِ پسِ انتشار: بی‌هیچ اعتبارنامه‌ای ────────────────────
          # «۲۰۰ گرفتم» کافی نیست (درخواستِ مالک): لینکِ کاربر باید ناشناس باز
          # شود، بایت‌هایش باید همان artifactِ بیلدشده باشد، و آپدیتِ دسکتاپ
          # نباید با این ریلیز خراب شده باشد.
          unset GH_TOKEN
          mkdir -p _pubcheck
          curl -fL --retry 3 "$DOWNLOAD" -o _pubcheck/apk_from_link.apk
          LINK_SUM=$(sha256sum _pubcheck/apk_from_link.apk | cut -d' ' -f1)
          echo "دانلودِ ناشناسِ لینکِ کاربر: $(stat -c '%s' _pubcheck/apk_from_link.apk) بایت · sha256 $LINK_SUM"
          [ "$LINK_SUM" = "$SUM" ] || { echo "بایت‌هایِ لینکِ عمومی با artifactِ بیلدشده نمی‌خواند" >&2; exit 1; }
          # آپدیتِ دسکتاپ: latest.json باید همچنان درِ releases/latest پیدا شود و
          # نسخۀ خودِ دسکتاپ را بگوید، نه ریلیزِ اندروید.
          curl -fL --retry 3 "https://github.com/$PUBLISH_REPO/releases/latest/download/latest.json" \
            -o _pubcheck/latest.json
          DESK_TOP=$(python3 -c 'import json;d=json.load(open("_pubcheck/latest.json",encoding="utf-8"));print(d.get("version") or sorted(d))' 2>/dev/null || echo نامعلوم)
          echo "releases/latest/download/latest.json → نسخۀ $DESK_TOP (باید نسخۀ دسکتاپ باشد، نه $BORS_VERSION_NAME)"
          # بستۀ دادۀ گوشی: همان URL درِ باندل، ناشناس، و **پارس‌شدنی** — gzip
          # باز می‌شود و SQLite فایلِ واقعی با جدولِ tsetmc ازِ آب درمی‌آید.
          DATA_META="https://github.com/$PUBLISH_REPO/releases/download/$SNAPSHOT_SERIES/mobile_snapshot.db.meta.json"
          DATA_GZ="https://github.com/$PUBLISH_REPO/releases/download/$SNAPSHOT_SERIES/mobile_snapshot.db.gz"
          curl -fsSL "$DATA_META" -o _pubcheck/meta.json || echo "meta.json پیدا نشد (سریِ $SNAPSHOT_SERIES هنوز منتشر نشده)"
          if [ -s _pubcheck/meta.json ]; then
            curl -fL --retry 2 "$DATA_GZ" -o _pubcheck/snap.db.gz
            python3 - <<'PY'
          import gzip, hashlib, json, sqlite3, sys, tempfile, os
          meta = json.load(open("_pubcheck/meta.json", encoding="utf-8"))
          gz = open("_pubcheck/snap.db.gz", "rb").read()
          raw = gzip.decompress(gz)
          want = str(meta.get("gz_sha256") or "")
          got = hashlib.sha256(gz).hexdigest()
          fd, pth = tempfile.mkstemp(suffix=".db"); os.close(fd); open(pth, "wb").write(raw)
          con = sqlite3.connect(pth)
          tables = [r[0] for r in con.execute("select name from sqlite_master where type='table'")]
          probe = next((t for t in ("instruments", "baked", "price_history", "meta") if t in tables), None)
          rows = con.execute("select count(*) from %s" % probe).fetchone()[0] if probe else -1
          con.close(); os.unlink(pth)
          # آرایۀ جداول از خودِ قرارداد خوانده می‌شود، نه از یک شمارۀ حفظی:
          # نسخهٔ پیشین `len(tables) >= 5` می‌خواست درحالی‌که خودِ
          # scripts/build_mobile_snapshot.py قرارداد را «baked, meta, instruments,
          # price_history» یعنی چهار جدول اعلام می‌کند — پس چک همیشه قرمز بود و
          # هیچ نقصِ داده‌ای را نشان نمی‌داد.
          declared = [str(x) for x in (meta.get("tables") or [])]
          have = set(tables)
          missing = [t for t in declared if t not in have]
          extra = sorted(have - set(declared))
          shast = "match" if (want and want == got) else ("absent" if not want else "MISMATCH")
          ok = bool(declared) and not missing and not extra and shast == "match" and rows > 0
          print("snapshot parsed: %d B gz -> %d B raw, tables=%s declared=%s missing=%s extra=%s, rows(%s)=%d, gz-sha=%s, built_at=%s, OK=%s" % (
              len(gz), len(raw), ",".join(sorted(have)), ",".join(declared),
              ",".join(missing) or "-", ",".join(extra) or "-", probe or "-", rows,
              shast, meta.get("built_at"), ok))
          sys.exit(0 if ok else 1)
          PY
          fi

      # ── دودِ امضا: مسیرِ کدِ signing را بی‌کلیدِ واقعی اثبات می‌کند ──────────
      # کلیدِ انتشار درِ این پروژه وجود ندارد، پس هرگز با آن «تمرین» کرده نمی‌شود.
      # این گام یک keystoreِ دور‌ریختنیِ هم‌انسان می‌سازد (رمزِ ساختگی، بی‌ارزش،
      # فقط درِ RUNNER_TEMP)، همان BORS_KEYSTORE_PROPERTIES را به Gradle می‌دهد و
      # چک می‌کند زنجیره واقعاً کار می‌کند: نامِ خروجی app-release.apk می‌شود،
      # apksigner قبولش می‌کند، و گواهیِ چاپ‌شده مالِ همان کلیدِ ساختگی است.
      # عمداً **آخرین** گام است و بی‌درنگ پاک می‌شود: هیچ گامِ دیگری (انتشار
      # شاملش) نمی‌تواند این فایلِ امضاشده با کلیدِ بی‌ارزش را ببیند. این
      # artifact هرگز منتشر نمی‌شود و جایِ کلیدِ انتشار را هم نمی‌گیرد.
      - name: Signing smoke test (throwaway key, never published)
        if: env.APK_SIGNED != 'yes'
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          D="$RUNNER_TEMP/smoke"; mkdir -p "$D"; umask 077
          keytool -genkeypair -keystore "$D/smoke.jks" -storepass smoke-not-a-release-key \
            -keypass smoke-not-a-release-key -alias smoke -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=signing smoke test, O=not-for-release" >/dev/null 2>&1
          { echo "storeFile=$D/smoke.jks"; echo "storePassword=smoke-not-a-release-key";
            echo "keyAlias=smoke"; echo "keyPassword=smoke-not-a-release-key"; } > "$D/ks.properties"
          cd frontend/android
          BORS_KEYSTORE_PROPERTIES="$D/ks.properties" ./gradlew assembleRelease --no-daemon \
            -PBorsVersionName="$BORS_VERSION_NAME" -PBorsVersionCode="$BORS_VERSION_CODE" > "$D/gradle.log" 2>&1 \
            || { tail -20 "$D/gradle.log"; echo "SMOKE FAIL: مسیرِ امضا درِ Gradle کار نمی‌کند" >&2; exit 1; }
          SIGNED=app/build/outputs/apk/release/app-release.apk
          test -s "$SIGNED" || { echo "SMOKE FAIL: با کلید، نامِ خروجی app-release.apk نشد" >&2; exit 1; }
          "$BT/apksigner" verify --print-certs "$SIGNED" | grep -m1 -E "Signer #1 certificate DN|SHA-256" || true
          "$BT/apksigner" verify "$SIGNED" && echo "SMOKE OK: signingConfig + apksigner زنجیره‌شان کار می‌کند (کلیدِ ساختگی؛ منتشر نمی‌شود)"
          rm -rf app/build/outputs/apk/release "$D"
          echo "تمیز شد: artifactِ کلیدِ ساختگی حذف گردید تا هیچ گامی آن را نبیند"

  # ── مادۀ ارتقا: کلیدِ پایدار ⇒ ارتقایِ درجا؛ کلیدِ دیگر ⇒ ردِ نصب ────────────
  # این job پرسشِ مرحلۀ پنجمِ مأموریت را با آزمونِ واقعی جواب می‌دهد، نه با
  # استدلال: آیا نسخهٔ رسمیِ امضاشده رویِ نسخهٔ رسمیِ قبلی نصب می‌شود، و آیا
  # عوض‌شدنِ کلید همان INSTALL_FAILED_UPDATE_INCOMPATIBLE را می‌سازد که درِ دو
  # ریلزِ debugِ قبلی ما داشتیم؟ سه کلیدِ دورریختنی (هرگز کلیدِ انتشار) و سه
  # بیلدِ release؛ هیچ artifactی منتشر نمی‌شود و کلیدها بی‌درنگ پاک می‌شوند.
  upgrade-matrix-on-device:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare the web bundle for three release builds
        working-directory: frontend
        run: |
          set -e
          npm ci
          # بستۀ داده عمداً دانلود نمی‌شود: این مادۀ «نصب/ارتقا» است، نه محتوا.
          # نبودِ gz یعنی WebView صفحهٔ بوت را نشان می‌دهد؛ pidof با این باز هم
          # فرآیندِ زنده می‌دهد و سنجشِ محتوا درِ jobِ webview-on-emulator است.
          VITE_LOCAL_DATA=1 VITE_APP_VERSION="$(node -p "require('./package.json').version")" npm run build
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: KVM probe
        id: kvm
        run: |
          set -e
          if [ -e /dev/kvm ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "NOT_VERIFIED: بی‌/dev/kvm مادۀ ارتقا اجرا نمی‌شود (نه اینکه سبز باشد)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build three throwaway-signed APKs and run the install matrix
        if: steps.kvm.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # Bootِ AVD رویِ runner flakes است (رانِ 38781829171: هفت دقیقه «adb:
          # device offline» درحالی‌که مادۀ WebViewِ همان ران بالا آمد). نامِ درستِ
          # این ورودی emulator-boot-timeout است (میلی‌ثانیه)؛ نوشتنِ `boot-timeout`
          # را action بی‌صدا «ورودیِ ناشناخته» می‌شمارد و پیش‌فرض می‌ماند — پس
          # تنظیمی که اعمال‌شده می‌پنداری، اعمال نشده است.
          emulator-boot-timeout: 900000
          # رانِ 38802635761: mCurrentFocus = «ANR: com.android.systemui» و
          # uiautomator ۵۷ بایت داد — AVD پیش‌فرض زیرِ WebView + ۱۶ مگابایت SQLite
          # نفَس نمی‌آورد. RAMِ صریح، همان دام نیست: تخصیصِ خودِ runner است.
          ram-size: 5120
          script: bash tools/android_upgrade_matrix.sh

      - name: Record the honest result when the emulator cannot run
        if: steps.kvm.outputs.present != 'true'
        run: |
          set -e
          mkdir -p _audit/android_upgrade
          printf '%s\t%s\t%s\n' toolchain NOT_VERIFIED "no /dev/kvm on runner" > _audit/android_upgrade/matrix.tsv
          printf '{"counts":{"pass":0,"fail":0,"not_verified":1}}' > _audit/android_upgrade/summary.json


      - name: Upload the matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-upgrade-matrix-${{ github.sha }}
          path: _audit/android_upgrade/
          if-no-files-found: warn

  # ── WebView رویِ دستگاه: آزمونِ زنده درِ شبیه‌ساز ─────────────────────────────
  # درِ هر گزارشِ قبلی این مورد «انجام‌نشده» نوشته شده بود، چون رویِ ماشینِ
  # توسعه Java/Android SDK نیست و آزمون‌ها یا درِ jsdom بودند یا درِ Chromiumِ
  # دسکتاپ. این job همان چیزی را می‌سنجد که فقط WebView می‌دهد: نصب، نبودِ
  # صفحهٔ سفید، باز شدنِ دیتابیسِ بسته، سه اندازۀ تلفن، دکمهٔ بازگشت،
  # background/foreground، crash/ANR و نشتِ رمز درِ logcat.
  # صریح: بیلدی که نصب می‌شود **debug** است (DevTools فقط درِ debuggable باز
  # می‌شود)؛ پس این job مدرکِ «artifact رسمی آزموده شد» نیست و درِ گزارش هم
  # جدا از آن ثبت می‌شود.
  webview-on-emulator:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bors-mobile-candidate-${{ github.sha }}
          path: apks

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: KVM probe
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"; echo "KVM هست ⇒ شبیه‌سازِ x86 راه می‌افتد"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "NOT_VERIFIED: /dev/kvm درِ این runner نیست؛ شبیه‌سازِ x86 بدونِ شتابِ سخت‌افزاری عملاً بالا نمی‌آید."
          fi

      - name: Install, boot and probe the WebView
        if: steps.kvm.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # Bootِ AVD رویِ runner flakes است (رانِ 38781829171: هفت دقیقه «adb:
          # device offline» درحالی‌که مادۀ WebViewِ همان ران بالا آمد). نامِ درستِ
          # این ورودی emulator-boot-timeout است (میلی‌ثانیه)؛ نوشتنِ `boot-timeout`
          # را action بی‌صدا «ورودیِ ناشناخته» می‌شمارد و پیش‌فرض می‌ماند — پس
          # تنظیمی که اعمال‌شده می‌پنداری، اعمال نشده است.
          emulator-boot-timeout: 900000
          # رانِ 38802635761: mCurrentFocus = «ANR: com.android.systemui» و
          # uiautomator ۵۷ بایت داد — AVD پیش‌فرض زیرِ WebView + ۱۶ مگابایت SQLite
          # نفَس نمی‌آورد. RAMِ صریح، همان دام نیست: تخصیصِ خودِ runner است.
          ram-size: 5120
          script: bash tools/android_emu_verify.sh

      - name: Record the result honestly when the emulator cannot run
        if: steps.kvm.outputs.present != 'true'
        run: |
          mkdir -p _audit/android_emu
          printf 'NOT_VERIFIED\t/no-kvm\tشبیه‌ساز روی این runner اجرا نشد\n' > _audit/android_emu/steps.tsv
          printf '{"device":null,"apk":"apks/app-debug.apk","steps":[{"step":"emulator","result":"NOT_VERIFIED","note":"no /dev/kvm on runner"}],"counts":{"pass":0,"fail":0,"not_verified":1}}\n' > _audit/android_emu/summary.json
          cat _audit/android_emu/summary.json

      - name: Upload the device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-webview-evidence-${{ github.sha }}
          path: _audit/android_emu/
          if-no-files-found: warn
