name: mobile-apk
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'frontend/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install mobile frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # گیتِ تست: بدونِ این، گاردهایِ موبایل (انتخابگرِ مرده، resolver آفلاین،
      # برابریِ تیب، روتِ قیف) هیچ‌وقت درِ CI اجرا نمی‌شدند و APK از رویِ کدِ
      # قرمز ساخته می‌شد. صفرِ خطا درِ tsc شرطِ ساختِ اپ است.
      - name: Type-check and run the frontend suite
        working-directory: frontend
        run: |
          npx tsc -b
          npx vitest run

      - name: Build mobile frontend
        working-directory: frontend
        run: |
          export VITE_BUILD_TAG="uiux-${GITHUB_SHA::7} · run${GITHUB_RUN_NUMBER}"
          VITE_LOCAL_DATA=1 npm run build
          curl -fL --retry 3             https://github.com/johnwarchief/BorsTerminal-src/releases/download/mobile-latest/mobile_snapshot.db.gz             -o dist/mobile_snapshot.db.gz
          test -s dist/mobile_snapshot.db.gz

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor and build APK
        working-directory: frontend
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          stat -c '%n %s bytes' "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bors-mobile-uiux-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA="${GITHUB_SHA::7}"
          # base_main_commit = جایی که این شاخه از main جدا شده؛ بی‌این، ریلیزِ
          # موبایل قابلِ ردیابی به کدِ دسکتاپ نیست
          git fetch -q origin main
          BASE=$(git merge-base origin/main "$GITHUB_SHA")
          APK=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c '%s' "$APK")
          TAG="mobile-parity-$SHA"
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA"             --title "BorsTerminal Android — parity pack — $SHA"             --notes "بستۀ تجمیعیِ اندروید (یک ریلیز، نه per-fix).

          source commit: $GITHUB_SHA
          base_main_commit: $BASE
          build: frontend tsc + vitest سبز، سپس vite build (VITE_LOCAL_DATA=1) و gradlew assembleDebug
          artifact: app-debug.apk · $SIZE بایت · sha256 $SUM
          snapshot داده: از mobile-latest reuse شده (تازگی و بازپخت درِ docs/MASTER-EXECUTION-ROADMAP.md §15 ثبت می‌شود)
          وضعیتِ آیتم‌ها و شاهد هر کدام: docs/MASTER-EXECUTION-ROADMAP.md §15"
          gh release upload "$TAG" "$APK#bors-terminal-mobile.apk" --clobber
