name: Release BorsTerminal (Tauri v2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Release Windows App (Tauri v2)
    runs-on: windows-latest
    continue-on-error: true
    # دستی است: روی پوشِ تگ اجرا نمی‌شود. دلیلِ اندازه‌گیری‌شده (میانگین پنج
    # رانِ اخیر): این job ۱۱.۷ دقیقه از ۱۱.۸ دقیقهٔ کل ران را می‌گیرد در حالی که
    # هیچ فایلِ لازمِ محصول در ریلیز عمومی از آن نیست — تنها خروجی‌های
    # BorsTerminal_Setup/.sig/Manifest/Patch/codal.db.lzma/latest.json را jobِ
    # Inno آپلود می‌کند و Tauri روی mirror خصوصی می‌گذارد. مسیرِ به‌روزرسانیِ
    # واقعی هم همان latest.json عمومی است که به exeِ Inno اشاره می‌کند.
    # تستِ فرانت‌اند که فقط اینجا اجرا می‌شد به jobِ Inno منتقل شد.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Test Suite
        run: |
          cd frontend
          npx vitest run

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm run build

      - name: Build & Publish Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          projectPath: './frontend'
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'BorsTerminal Ultimate ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## ایستگاه معاملاتی و داوری نخبگان بورس التیمیت ${{ github.event.inputs.tag || github.ref_name }}
            
            ### تغییرات و ویژگی‌های این نسخه:
            - پکیج رسمی ویندوزی با هسته مدرن و فوق‌سبک Tauri v2
            - مجهز به سیستم به‌روزرسانی خودکار درون‌برنامه‌ای (In-App Auto-Updater) با امضای دیجیتال Minisign
            - سیستم احراز هویت ایزوله محلی با حفاظت ضد بروت‌فورس و قفل هوشمند
            - عملکرد سریع ۳۰ تا ۶۰ فریم بر ثانیه با معماری بهینه‌سازی‌شده
            
            ### فایل‌های نصبی پیوست‌شده:
            - نصاب استاندارد سبک ویندوز: `Bors Terminal Ultimate_*_x64-setup.exe` (NSIS)
            - پکیج نصبی سازمانی: `Bors Terminal Ultimate_*_x64_en-US.msi`
            - فایل متادیتا و مانیفست آپدیتر: `latest.json`
          releaseDraft: false
          prerelease: false
          # latest.json is generated and uploaded by scripts/publish_github_release.py,
          # where it points at the Inno installer (BorsTerminal_Ultimate_Setup_v{ver}.exe)
          # — the actual distributed build. Letting tauri-action emit it here would
          # wrongly point the in-app updater at the NSIS bundle.
          includeUpdaterJson: false

  # ─────────────────────────────────────────────────────────────────────
  # release-inno: build + publish the *actual* distributed installer.
  #
  # The Tauri/NSIS shell above cannot launch the Python backend (no sidecar),
  # so the Inno/PyInstaller bundle built here is the only deliverable users
  # can actually run. This job mirrors the local chain:
  #   scripts/build_all.py (PyInstaller) → ISCC (Inno) → tauri signer (minisign)
  #   → scripts/publish_github_release.py (upload + latest.json manifest)
  # ─────────────────────────────────────────────────────────────────────
  release-inno:
    name: Build & Release Inno Installer (PyInstaller)
    runs-on: windows-latest

    env:
      # e.g. ref_name "v1.0.4" → installer "BorsTerminal_Ultimate_Setup_v1.0.4.exe"
      # and ISCC AppVersion define "1.0.4".
      # Resolve the release tag the same way for the manual dispatch
      # (inputs.tag) and tag-push (ref_name) triggers; TAG drives the
      # ISCC AppVersion define, the installer filename and the release.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Check shipped data age
        # DATA-AGE-1. دیتابیسِ ریلیز هرگز در CI ساخته نمی‌شود:
        # market.db.lzma از خودِ ریپو می‌آید و codal.db.lzma از تازه‌ترین
        # ریلیزِ دارایِ فایل جلو برده می‌شود. پس این تنها جایی است که می‌شود
        # دید رویِ ماشینِ کاربر چه قدمتی می‌نشیند — پیش ازِ ساختنِ نصاب.
        #
        # عمداً continue-on-error: کهنه‌بودنِ داده دلیلِ بستنِ ریلیز نیست
        # (تعطیلاتِ نوروزی و ریلیزِ صرفاً UI هر دو مشروع‌اند). ولی
        # continue-on-error در API سبز گزارش می‌شود، پس پیام‌ها صریحاً به
        # ::warning::/::error:: تبدیل می‌شوند تا در annotations بمانند.
        shell: pwsh
        continue-on-error: true
        run: |
          $out = python scripts/check_release_db.py --baseline 2>&1
          $out | ForEach-Object { Write-Output $_ }
          $out | Select-String -Pattern '^(AGE_STALE|AGE_UNKNOWN|AGE_FUTURE|BASELINE_MISSING)' |
            ForEach-Object { Write-Output "::warning::[data-age] $($_.Line)" }
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::[data-age] baselineیِ commit‌شده سالم نیست (exit=$LASTEXITCODE) — نصاب با همین داده منتشر می‌شود"
          }
          # خودِ مرحله هم باید راستی‌آزمایی شود: اگر پایتون یا اسکریپت اجرا نشود،
          # هیچ AGE_* تولید نمی‌شود و «هشدار ندادن» با «سکوت» یکی می‌شود.
          if (-not ($out -match 'BASELINE_(OK|INCOMPLETE|TOO_SMALL|MISSING|BAD|NEWER)')) {
            Write-Output "::error::[data-age] مرحله هیچ خروجیِ اعتبارسنجی‌ای تولید نکرد؛ تازگیِ داده اصلاً سنجیده نشد"
          }
          exit 0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # دروازهٔ تستِ فرانت‌اند: قبلاً فقط در jobِ Tauri بود که از مسیرِ تگ حذف
      # شده؛ بی‌این مرحله ریلیزِ بدونِ تست می‌سازیم.
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Restore installer password include
        shell: pwsh
        env:
          BORS_SETUP_PASSWORD: ${{ secrets.BORS_SETUP_PASSWORD }}
        run: |
          # bors_setup.iss does `#include ".setup_password.iss"` (gitignored),
          # so ISCC cannot compile without it. Restore it from the secret and
          # use the same value fts_terminal.spec bundles into _internal, so the
          # in-app /VERYSILENT updater can pass /PASSWORD=... automatically.
          $pw = $env:BORS_SETUP_PASSWORD
          if ([string]::IsNullOrWhiteSpace($pw)) { $pw = 'BorsTerminal' }
          "#define SetupPassword ""$pw""" | Out-File -FilePath installer\.setup_password.iss -Encoding ascii -NoNewline

      - name: Build Python Backend (PyInstaller + bundle data)
        run: python scripts/build_all.py

      - name: Compile Inno Installer
        # /D overrides AppVersion in bors_setup.iss so the tag and the built
        # setup filename always match (OutputBaseFilename uses {#AppVersion}).
        run: |
          $ver = $env:TAG -replace '^v',''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\bors_setup.iss

      - name: Restore updater signing key
        shell: pwsh
        env:
          # .tauri/updater.key is gitignored; CI restores it from the repo
          # secret. This is the same base64 minisign key the in-app updater
          # trusts (api/update.py UPDATE_PUBKEY / tauri.conf.json pubkey
          # 830BF752EF10076). The key has no password.
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            Write-Error "secret TAURI_SIGNING_PRIVATE_KEY is empty - cannot sign the updater artifact"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path .tauri | Out-Null
          # The tauri signer's base64 decoder is strict: ANY whitespace (even a
          # trailing newline) fails with "Invalid symbol 10". Write the key as
          # one continuous line with no newline at all.
          [System.IO.File]::WriteAllText("$PWD\.tauri\updater.key", ($env:KEY -replace '\s',''))
          # .tauri/updater.key.pub هم لازم است: scripts/sign_setup.py بعد از
          # امضا، امضای ساخته‌شده را با همین فایل راستی‌آزمایی می‌کند و اگر
          # نبود با FileNotFoundError می‌مرد — یعنی پچِ CI ساخته می‌شد ولی
          # بی‌امضا می‌ماند و ریلیز بدونِ دلتا منتشر می‌شد (v1.0.23، run 6).
          # کلیدِ عمومی همان UPDATE_PUBKEYِ خودِ آپدیتِر است (۱۵۲ کاراکتر، بدون
          # newline)، پس این‌را از همان‌جا می‌نویسیم تا امضا قطعاً با همان کلیدی
          # که کاربر می‌شناسد بررسی شود.
          python -c "import sys; sys.path.insert(0, '.'); from api.update import UPDATE_PUBKEY; open(r'.tauri/updater.key.pub', 'w', encoding='ascii', newline='').write(UPDATE_PUBKEY)"
          if ($LASTEXITCODE -ne 0) { Write-Error "cannot write .tauri/updater.key.pub from UPDATE_PUBKEY"; exit 1 }
          Write-Host "updater.key.pub: $((Get-Item .tauri/updater.key.pub).Length) bytes"

      - name: Sign Installer with Updater Key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          cd frontend
          npx tauri signer sign -f ..\.tauri\updater.key "..\installer\out\BorsTerminal_Ultimate_Setup_$env:TAG.exe"

      # دلتای واقعی فقط وقتی کوچک می‌ماند که هر دو طرفِ diff با همان زنجیره
      # (پایتونِ 3.12ِ همین CI) ساخته شده باشند — بیلدِ محلی روی 3.14 صدها
      # باینریِ ناهمسان تولید می‌کند و پچ ۵۵ مگابایتیِ بی‌فایده. پس بیلدِ پچ
      # هم اینجا انجام می‌شود: نصابِ نسخهٔ قبلی به یک پوشهٔ موقت نصبِ سایلنت
      # می‌شود (پسوندِ postinstall یعنی برنامه بالا نمی‌آید) و make_patch
      # با همان کلیدِ updater امضا می‌کند. continue-on-error: اگر هر مرحله‌ای
      # شکست بخورد، ریلیز بدونِ پچ منتشر می‌شود (همان رفتارِ v1.0.22) —
      # publish_github_release.py با غیابِ پچ شفافاً نصبِ کامل را معرفی می‌کند.
      - name: Write File Manifest (delta baseline for the next release)
        # فهرستِ sha256ِ همین بیلد کنارِ نصاب منتشر می‌شود تا نسخهٔ بعد
        # بتواند پچِ دلتا را بدونِ دانلودکردنِ نصاب و بدونِ اجرایِ installer
        # روی رانر بسازد.
        shell: pwsh
        continue-on-error: true
        run: |
          # نبودِ این فایل نباید ریلیز را متوقف کند، ولی باید در annotations
          # دیده شود: لاگ رانر از این شبکه باز نمی‌شود و continue-on-error
          # نتیجه را در API سبز نشان می‌دهد.
          $f = "dist/BorsTerminal_Manifest_$env:TAG.json"
          python scripts/make_patch.py --emit-manifest $f
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Output "::error::[manifest] make_patch exit=$code"; exit 1 }
          if (-not (Test-Path $f)) { Write-Output "::error::[manifest] $f ساخته نشد"; exit 1 }
          Write-Output "::notice::[manifest] $f = $((Get-Item $f).Length) بایت"

      - name: Build Delta Patch (previous installer -> this build)
        shell: pwsh
        continue-on-error: true
        env:
          BORS_SETUP_PASSWORD: ${{ secrets.BORS_SETUP_PASSWORD }}
          # توکنِ خودِ رانر برای خواندنِ تگ‌ها از API. قبلاً بدونِ توکن پرسیده
          # می‌شد و IP مشترکِ رانر rate-limit می‌خورد.
          TAGS_TOKEN: ${{ github.token }}
        run: |
          # continue-on-error نتیجه را در API به‌صورت success نشان می‌دهد و
          # لاگ‌های رانر از این شبکه باز نمی‌شوند، پس هر مرحله با ::notice:: در
          # annotations ثبت می‌شود: «پچ ساخته شد و اندازه‌اش چقدر بود» باید بدون
          # بازکردنِ لاگ قابل دیدن باشد (v1.0.23 سه بار سبز شد و پچ نداشت).
          function Note([string]$m) { Write-Output "::notice::[patch] $m" }
          function Fail([string]$m) { Write-Output "::error::[patch] $m"; exit 1 }
          $ver = $env:TAG -replace '^v',''
          try {
            $tags = @()
            try {
              $rel = Invoke-RestMethod `
                -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/tags?per_page=100" `
                -Headers @{ Authorization = "Bearer $env:TAGS_TOKEN";
                           "User-Agent"   = "bors-ci";
                           Accept         = "application/vnd.github+json" }
              $tags = $rel.name | ForEach-Object { $_ -replace '^v','' } |
                Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
                Sort-Object { [version]$_ } -Descending -Unique
              Note "تگ‌ها از API: $($tags -join ' ')"
            } catch {
              Note "API تگ‌ها کار نکرد: $($_.Exception.Message)"
            }
            if (-not $tags) {
              # git برای هر چه‌چه‌ای stderr می‌نویسد و $ErrorActionPreference=Stop
              # آن را به exception تبدیل می‌کند؛ این مسیر عمداً Continue است.
              $ErrorActionPreference = 'Continue'
              $raw = (& git ls-remote --tags origin) 2>$null
              $lsCode = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              if ($lsCode -ne 0) { Fail "هم API و هم ls-remote (exit $lsCode) مبدأ را ندادند" }
              $tags = $raw | ForEach-Object { ($_ -split '\s+')[1] } |
                ForEach-Object { $_ -replace '^refs/tags/','' -replace '\^\{\}$','' -replace '^v','' } |
                Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
                Sort-Object { [version]$_ } -Descending -Unique
              Note "تگ‌ها از ls-remote: $($tags -join ' ')"
            }
            # کاربری که دو سه نسخه عقب است هم باید آپدیتِ کوچک بگیرد، نه نصابِ
            # ۵۷ مگابایتی: برایِ هر یک از سه نسخهٔ اخیر که manifest دارد یک پچِ
            # مستقل ساخته می‌شود. هر پچ diffِ کاملِ همان مبدأ با بیلدِ تازه است
            # (پچ‌ها زنجیره‌ای اعمال نمی‌شوند)، پس 1.0.22→1.0.25 خودش cumulative
            # است و آپدیتِر از آرایهٔ patches فقط ورودیِ نسخهٔ خودش را برمی‌دارد.
            #
            # مسیرِ قدیمی «نصابِ قبلی را روی رانر نصب کن و فرق بگیر» حذف شد:
            # از v1.0.23 هر ریلیز manifest خودش را منتشر می‌کند، و همان مسیر روی
            # رانر شکننده بود (خودِ فایلِ سالم exit 1 با «گذرواژه اشتباه است»).
            $prevs = @($tags | Where-Object { $_ -ne $ver } | Select-Object -First 3)
            if ($prevs.Count -eq 0) { Fail "نسخهٔ قبلیِ v$ver در تگ‌ها نیست ($($tags -join ' '))" }
            Note "مبدأهایِ پچ: $(($prevs | ForEach-Object { "v$_" }) -join ' ') -> v$ver"
            $built = @()
            for ($i = 0; $i -lt $prevs.Count; $i++) {
              $prev = $prevs[$i]
              # نخستِ فهرست = نسخهٔ بلافاصلهٔ قبل. نبودِ پچِ آن وعدهٔ «آپدیتِ
              # کوچک» را می‌شکند، پس شکستش خطاست؛ مبدأهایِ قدیمی‌تر best-effort
              # می‌مانند (نبودشان فقط یعنی آن کاربر به نصبِ کامل برمی‌گردد).
              $primary = ($i -eq 0)
              $mfName = "BorsTerminal_Manifest_v$prev.json"
              $mfPath = Join-Path $env:RUNNER_TEMP $mfName
              if (-not (Test-Path $mfPath)) {
                try {
                  Invoke-WebRequest -Uri "https://github.com/johnwarchief/BorsTerminal/releases/download/v$prev/$mfName" -OutFile $mfPath
                } catch {
                  if ($primary) { Fail "manifestِ $prev روی ریلیز نیست؛ پچِ اصلی ساخته نمی‌شود" }
                  Note "manifestِ $prev نیست؛ از $prev پچ ساخته نمی‌شود"
                  continue
                }
              }
              Note "manifestِ $prev دریافت شد: $((Get-Item $mfPath).Length) بایت"
              $mpArgs = @("scripts/make_patch.py", "--from", $prev,
                          "--baseline-manifest", $mfPath)
              $mpLog = Join-Path $env:RUNNER_TEMP "make_patch_$prev.log"
              # خروجیِ non-zero یک دستورِ native در pwsh خطا محسوب نمی‌شود، پس
              # $LASTEXITCODE صریحاً خوانده می‌شود و لاگ در فایل می‌ماند.
              $ErrorActionPreference = 'Continue'
              & python @mpArgs *> $mpLog
              $mpExit = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              $tail = ((Get-Content $mpLog -Tail 5 -ErrorAction SilentlyContinue) -join ' | ') -replace '\r?\n', ' '
              Note "make_patch($prev) exit=$mpExit :: $tail"
              if ($mpExit -ne 0) {
                if ($primary) { Fail "make_patch برایِ $prev با کدِ $mpExit خارج شد" }
                continue
              }
              $patchZip = "dist/BorsTerminal_Patch_${prev}_to_${ver}.zip"
              if (-not (Test-Path $patchZip)) {
                if ($primary) { Fail "make_patch برایِ $prev zip نساخت (exit=$mpExit)" }
                continue
              }
              $sz = [math]::Round((Get-Item $patchZip).Length / 1MB, 2)
              $built += "$prev=$sz MB"
              Note "artifact: $(Split-Path -Leaf $patchZip) $sz MB"
            }
            if ($built.Count -eq 0) { Fail "هیچ پچی ساخته نشد؛ همه به نصبِ کامل می‌افتند" }
            Note "پچ‌هایِ منتشرشدنی: $($built -join ' | ')"
          } catch {
            Fail "استثنایِ پیش‌بینی‌نشده: $($_.Exception.Message)"
          }

      - name: Publish Release (installer + .sig + latest.json)
        env:
          # The release lives on the public distribution repo, so the source
          # mirror's default GITHUB_TOKEN cannot write there. RELEASE_TOKEN is a
          # PAT with access to both repos; fall back to GITHUB_TOKEN when unset.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python scripts/publish_github_release.py
