import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// ── منبعِ یکتایِ نسخۀ برنامه ─────────────────────────────────────────────────
// `frontend/package.json` لنگرِ رسمی است (همان که dev/version_anchor_guard.py و
// tools/bump_version.py نگه می‌دارند). پیش‌ازِ این این فایل `versionName "1.0"` و
// `versionCode 1`ِ قالبِ Capacitor را داشت ⇒ APK هیچ‌وقت نسخۀ واقعی را نمی‌گفت و
// «سازگاریِ نسخه» درِ کلاینت با عددی می‌سوخت که هیچ‌جا منتشر نمی‌شد.
// CI می‌تواند با -PBorsVersionName / -PBorsVersionCode همان عددِ رسمی را تزریق کند؛
// اگر تزریق کرد، **باید** با package.json بخواند — بی‌این، دو منبعِ متفاوت
// ساکت دو جواب می‌دهند. versionCode از همان نسخه مشتق می‌شود و تنها در
// equality سنجیده می‌شود (بازشماری/پایین‌آمدنِ نسخهٔ منتشرشده ممکن نیست، چون
// x.y.z یکنوا است و مشتق هم یکنوا: major·1e6 + minor·1e3 + patch، با minor/patch < 1000).
def borsPkgVersion = {
    def f = new File(rootProject.projectDir, "../package.json")
    if (!f.exists()) {
        throw new GradleException("BORS-VERSION: package.json یافت نشد (${f}) — منبعِ رسمی نسخه نیست")
    }
    def v = new JsonSlurper().parse(f).version?.toString()?.trim()
    if (!v?.matches(/\d+\.\d+\.\d+/)) {
        throw new GradleException("BORS-VERSION: نسخۀ رسمی نامعتبر است: '${v}' (x.y.z لازم است)")
    }
    return v
}()

def borsDeriveCode = { String v ->
    def p = v.split(/\./).collect { it.toInteger() }
    if (p[1] > 999 || p[2] > 999) {
        throw new GradleException("BORS-VERSION: minor/patch باید <۱۰۰۰ بماند تا versionCode یکتا بماند (${v})")
    }
    return p[0] * 1000000 + p[1] * 1000 + p[2]
}

def borsVersionName = {
    def inj = (findProperty('BorsVersionName') ?: System.getenv('BORS_VERSION_NAME'))?.toString()?.trim()
    if (inj) {
        if (inj != borsPkgVersion) {
            throw new GradleException("BORS-VERSION: versionName تزریق‌شده (${inj}) با نسخۀ رسمی (${borsPkgVersion}) نمی‌خواند")
        }
        return inj
    }
    return borsPkgVersion
}()

def borsVersionCode = {
    def inj = (findProperty('BorsVersionCode') ?: System.getenv('BORS_VERSION_CODE'))?.toString()?.trim()
    def want = borsDeriveCode(borsPkgVersion)
    if (!inj) return want
    def got = inj.toInteger()
    if (got != want || got <= 0) {
        throw new GradleException("BORS-VERSION: versionCode تزریق‌شده (${got}) با مشتقِ رسمی (${want}) یا مثبت نیست")
    }
    return got
}()

// ── امضایِ انتشار: سازوکارِ رسمیِ پروژه، بی‌بازگشتِ ساکت به debug ───────────
// تا پیش‌ازِ این، این ماژول هیچ signingConfig نداشت و CI فقط `assembleDebug`
// می‌ساخت؛ شاهد: دو APKِ منتشرشده (mobile-latest و mobile-parity-9f7427d) هر دو
// `CN=Android Debug` بودند ولی اثرانگشتشان با هم فرق داشت ⇒ ارتقایِ درجا رویِ
// گوشی هیچ‌وقت ممکن نبود. از این پس «نسخۀ رسمی» فقط از یک keystore خوانده
// می‌شود که مسیرش از بیرونِ گیت داده می‌شود.
//
// چرا فایلِ properties و نه `-PstorePassword=…`: مقدارِ ردِ‌شده درِ فرمانِ
// gradlew درِ فهرستِ فرآیندها (Windows/Linux) قابلِ خواندن است و درِ لاگِ CI
// می‌نشیند. اینجا تنها *مسیر* فایل درِ فرمان می‌آید و رمزها درِ فایلی
// خواندنی‌نشدنی برایِ گیت می‌مانند.
def borsKsProps = new Properties()
def borsKsPath = (findProperty('BorsKeystoreProperties')
    ?: System.getenv('BORS_KEYSTORE_PROPERTIES'))?.toString()?.trim()
if (borsKsPath) {
    def f = new File(borsKsPath)
    if (!f.canRead()) {
        throw new GradleException("BORS-SIGN: فایلِ propertiesِ keystore خوانده نشد: ${f}")
    }
    f.withInputStream { borsKsProps.load(it) }
}
def borsKsFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def borsKsGiven = borsKsFields.findAll { !borsKsProps.getProperty(it)?.trim() }
def borsReleaseSigned = false
if (borsKsPath) {
    if (borsKsGiven) {
        // نیمه‌کاره = فاجعه: بیلدی که «انگار امضا شده» ولی نشده. بی‌صدا رد نمی‌شود.
        throw new GradleException("BORS-SIGN: این کلیدهایِ propertiesِ keystore خالی‌اند: ${borsKsGiven.join(', ')}")
    }
    if (borsKsProps.getProperty('storeFile').trim().toLowerCase().endsWith('debug.keystore')) {
        // قاعدۀ مأموریت: debug keystore هرگز جایِ کلیدِ انتشار را نمی‌گیرد.
        throw new GradleException('BORS-SIGN: storeFile به debug.keystore اشاره می‌کند؛ نسخۀ رسمی با کلیدِ debug ساخته نمی‌شود.')
    }
    borsReleaseSigned = true
}
logger.lifecycle("BORS-SIGN: release signing = ${borsReleaseSigned ? 'configured' : 'ABSENT (release APK will be unsigned)'}")

android {
    namespace = "com.borsterminal.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.borsterminal.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode borsVersionCode
        versionName borsVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (borsReleaseSigned) {
            borsRelease {
                storeFile file(borsKsProps.getProperty('storeFile').trim())
                // نوع keystore ازِ props خوانده می‌شود، نه حدس: Java/KeyStore
                // فایلِ PKCS12 را با نوعِ JKS **باز نمی‌کند** (پیش‌فرضِ AGP). وقتی
                // کلیدِ انتشار بی‌keytool ساخته شود، ظرفِ آن PKCS12 است.
                // `=` اینجا لازم است: «storeType (a ?: b).trim()» درِ Groovy به‌شکلِ
                // فراخوانیِ متدِ storeType(...) و بعدِ .trim() رویِ نتیجهٔ تهی
                // خوانده می‌شود و می‌شکند (شاهد: رانِ 38809760278، سطرِ ۱۱۹).
                storeType = (borsKsProps.getProperty('storeType') ?: 'JKS').trim()
                storePassword borsKsProps.getProperty('storePassword')
                keyAlias borsKsProps.getProperty('keyAlias')
                keyPassword borsKsProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // نسخۀ رسمی هرگز debuggable نیست: با debuggable=true خودِ WebView
            // `setWebContentsDebuggingEnabled` می‌گیرد و هر console.error یا
            // رشتهٔ خطا از راهِ DevTools رویِ گوشیِ کاربر بیرون می‌آید.
            debuggable false
            if (borsReleaseSigned) {
                signingConfig signingConfigs.borsRelease
            }
            // بی‌کلید، APK **بی‌امضا** می‌ماند (نه debug). دروازۀ انتشار درِ
            // .github/workflows/mobile.yml همین را می‌بیند و ریلیز را می‌بندد؛
            // ساختِ بی‌امضا برایِ آزمونِ خودِ زنجیره مجاز است.
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
